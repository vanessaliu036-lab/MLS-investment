<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>MLS · 盤中決策</title>
<style>
  :root{
    color-scheme:light;
    --bg:#fcfcfd;--card:#ffffff;--soft:#f4f5f8;--line:#edeff3;
    --ink:#0e1116;--sub:#3a4150;--faint:#565e6e;
    --up:#f43f5e;--up-soft:#fff1f3;--down:#10b981;--down-soft:#ecfdf5;
    --amber:#f59e0b;--amber-soft:#fffbeb;--violet:#6366f1;--violet-soft:#f0f1fe;
    --in:#f43f5e;--in-soft:#fff1f3;--out:#e07b2e;--out-soft:#fdf3e9;
    --shadow:0 1px 3px rgba(15,18,25,.04),0 8px 24px rgba(15,18,25,.06);
    --shadow-lg:0 12px 40px rgba(15,18,25,.12);--r:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#fcfcfd !important;color:#0e1116 !important}
  body{font-family:-apple-system,"SF Pro Text","PingFang TC","Noto Sans TC","Segoe UI",sans-serif;font-size:14px;line-height:1.5;padding-bottom:40px;letter-spacing:-.01em;max-width:640px;margin:0 auto}
  @media (prefers-color-scheme:dark){html,body{background:#fcfcfd !important;color:#0e1116 !important}}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .up{color:var(--up)}.down{color:var(--down)}.in{color:var(--in)}.out{color:var(--out)}

  /* 頂部 */
  .top{position:sticky;top:0;z-index:40;background:rgba(252,252,253,.86);backdrop-filter:saturate(1.4) blur(16px);padding:14px 18px 10px;border-bottom:1px solid var(--line)}
  .top-r1{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .logo{font-size:17px;font-weight:750;letter-spacing:-.02em}
  .logo .live{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--down);margin-left:8px}
  .live .d{width:7px;height:7px;border-radius:50%;background:var(--down);animation:pl 1.8s infinite}
  @keyframes pl{0%{box-shadow:0 0 0 0 rgba(16,185,129,.4)}70%{box-shadow:0 0 0 6px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
  .clock{margin-left:auto;font-size:13px;font-weight:700;color:var(--sub)}
  .idxrow{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none}
  .idxrow::-webkit-scrollbar{display:none}
  .idx{flex:none}.idx .k{font-size:10.5px;color:var(--faint);font-weight:600}.idx .v{font-size:15px;font-weight:750}.idx .c{font-size:11px;font-weight:700}

  /* 分頁按鈕列(插件入口) */
  .tabs{display:flex;gap:7px;overflow-x:auto;padding:10px 18px;scrollbar-width:none;background:var(--bg);position:sticky;top:0;z-index:30}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;font-size:13px;font-weight:700;padding:8px 15px;border-radius:100px;background:var(--card);color:var(--sub);border:1px solid var(--line);cursor:pointer;transition:.12s;white-space:nowrap}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tab .ic{margin-right:4px}

  .wrap{padding:18px}
  .sec{margin-bottom:24px}
  .sec-h{display:flex;align-items:baseline;gap:8px;margin:0 4px 12px}
  .sec-t{font-size:19px;font-weight:750;letter-spacing:-.02em}
  .sec-s{font-size:12px;color:var(--faint);font-weight:600}
  .sec-x{margin-left:auto;font-size:12px;color:var(--faint);font-weight:600}

  /* 一句話結論 */
  .verdict{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:18px}
  .verdict .lead{font-size:12px;font-weight:700;color:var(--violet);margin-bottom:6px}
  .verdict .big{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
  .verdict .big em{font-style:normal;color:var(--up)}
  .verdict .sub{font-size:13px;color:var(--sub);margin-top:8px;font-weight:500;line-height:1.6}

  /* treemap */
  .heat-mode{display:flex;gap:6px;margin:0 4px 10px}
  .heat-mode b{font-size:12px;font-weight:700;padding:6px 13px;border-radius:100px;background:var(--card);border:1px solid var(--line);color:var(--sub);cursor:pointer}
  .heat-mode b.on{background:var(--violet);color:#fff;border-color:var(--violet)}
  #tree{position:relative;width:100%;height:400px;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:var(--card)}
  .cell{position:absolute;overflow:hidden;cursor:pointer;border:2px solid #fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:3px;transition:filter .1s}
  .cell:active{filter:brightness(1.05)}
  .cell.sel{border-color:var(--violet);z-index:5}
  .cell .cn{font-weight:800;line-height:1.15;color:#0e1116;white-space:nowrap}
  .cell .cv{font-weight:750;line-height:1.2;margin-top:2px;color:#0e1116;opacity:.85;white-space:nowrap}
  .cell .lk{position:absolute;top:3px;right:4px;font-size:9.5px;background:var(--violet);color:#fff;padding:0 5px;border-radius:4px;font-weight:800}
  .legend{display:flex;align-items:center;gap:0;margin:10px 4px 2px}
  .legend .grad{flex:1;height:7px;border-radius:100px;background:linear-gradient(90deg,#f43f5e,#f79aa8,#fbd0d6,#eef0f3,#bfe8d5,#6bcfa0,#10b981)}
  .legend-l{display:flex;justify-content:space-between;margin:3px 4px 0;font-size:10.5px;color:var(--faint);font-weight:600}

  /* 展開個股 */
  .drill{margin-top:14px}
  .drill-h{display:flex;align-items:center;gap:8px;margin:0 4px 10px;flex-wrap:wrap}
  .drill-h .dt{font-size:15px;font-weight:750}
  .drill-h .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px}
  .badge.in{background:var(--in-soft);color:var(--in)}.badge.out{background:var(--out-soft);color:var(--out)}
  .badge.act{background:var(--violet-soft);color:var(--violet)}
  .drill-h .hz-mod{padding:3px 9px;border-radius:100px;font-size:11px;font-weight:700;cursor:help}
  .drill-h .hz-mod.hz-up{background:var(--up-soft);color:var(--up)}
  .drill-h .hz-mod.hz-warn{background:var(--amber-soft);color:var(--amber)}
  .drill-h .hz-mod.hz-vio{background:var(--violet-soft);color:var(--violet)}
  .drill-h .hz-mod.hz-dn{background:var(--down-soft);color:var(--down)}
  .drill-h .cnt{margin-left:auto;font-size:12px;color:var(--faint);font-weight:600}
  .stocks{display:flex;flex-direction:column;gap:9px}
  .stock{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s;display:flex;align-items:center;gap:12px}
  .stock:active{transform:scale(.985)}
  .stock .stripe{width:4px;align-self:stretch;border-radius:4px;background:var(--faint);min-height:30px}
  .stock.buy .stripe{background:var(--up)}.stock.sell .stripe{background:var(--down)}.stock.watch .stripe{background:var(--amber)}
  .stock .sway{flex:1;min-width:0}
  .stock .snm{font-size:16px;font-weight:750;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .stock .snm .at{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:100px}
  .at.buy{background:var(--up-soft);color:var(--up)}.at.sell{background:var(--down-soft);color:var(--down)}.at.watch{background:var(--amber-soft);color:var(--amber)}
  .stock .sid{font-size:11px;color:var(--faint);font-weight:600;margin-top:2px}
  .stock .shead{font-size:12.5px;color:var(--ink);font-weight:650;margin-top:3px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stock .shead b{color:var(--violet);font-weight:800}
  .stock .sright{text-align:right;flex:none}
  .stock .sprice{font-size:16px;font-weight:750}
  .stock .spct{font-size:12px;font-weight:700}
  .stock .conf{font-size:11px;font-weight:800;padding:4px 9px;border-radius:100px;background:var(--violet-soft);color:var(--violet);flex:none}
  .empty{padding:26px;text-align:center;color:var(--faint);background:var(--card);border-radius:var(--r);font-weight:600;box-shadow:var(--shadow);font-size:13px;line-height:1.7}

  /* 盤中資金流動(以族群為第一層;每族群內進場+出場) */
  .flow-sec .flow-note{font-size:11.5px;color:var(--faint);font-weight:600;margin:0 4px 12px}
  .sec-group{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
  .sec-group-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--soft)}
  .sec-group-h .gnm{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .sec-group-h .gpct{font-size:13px;font-weight:800}
  .sec-group-h .gflow{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:100px}
  .sec-group-h .gflow.in{background:var(--in-soft);color:var(--in)}
  .sec-group-h .gflow.out{background:var(--out-soft);color:var(--out)}
  .sec-group-h .gcnt{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:600}
  .sec-group-b{padding:4px 12px 10px}
  .sec-group-b .sub-zh{display:flex;align-items:center;gap:6px;margin:8px 4px 6px}
  .sec-group-b .sub-zh .dot{width:7px;height:7px;border-radius:50%}
  .sec-group-b .sub-zh.buy .dot{background:var(--up)}.sec-group-b .sub-zh.sell .dot{background:var(--down)}
  .sec-group-b .sub-zh .lab{font-size:12px;font-weight:800;color:var(--sub)}
  .sec-group-b .sub-zh .cnt{font-size:11px;color:var(--faint);font-weight:600;margin-left:6px}
  .frow{background:var(--card);border-radius:12px;padding:10px 13px;box-shadow:0 1px 2px rgba(15,18,25,.04);cursor:pointer;display:flex;align-items:center;gap:11px;margin-bottom:6px;transition:transform .1s}
  .frow:active{transform:scale(.985)}
  .frow .fstripe{width:4px;align-self:stretch;border-radius:4px;min-height:24px}
  .frow.buy .fstripe{background:var(--up)}.frow.sell .fstripe{background:var(--down)}
  .frow .fmain{flex:1;min-width:0}
  .frow .fnm{font-size:14.5px;font-weight:750}
  .frow .fsub{font-size:10.5px;color:var(--faint);font-weight:600;margin-top:2px}
  .frow .fflow{text-align:right;flex:none}
  .frow .fflow .fv{font-size:14px;font-weight:800}
  .frow .fflow .fk{font-size:10px;color:var(--faint);font-weight:600}
  .frow .fpx{text-align:right;flex:none;min-width:62px}
  .frow .fpx .v{font-size:14.5px;font-weight:750}
  .frow .fpx .c{font-size:11px;font-weight:700}
  .sec-group-empty{padding:14px 12px;font-size:12px;color:var(--faint);text-align:center}

  /* 速覽 */
  .mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mini{background:var(--card);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow)}
  .mini .mk{font-size:11px;color:var(--faint);font-weight:600;margin-bottom:8px}
  .mini .mrow{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
  .mini .mrow .nm{font-weight:650}.mini .mrow .v{font-weight:750}
  .acc-big{display:flex;gap:8px;text-align:center}.acc-big .c{flex:1}
  .acc-big .cv{font-size:20px;font-weight:800;color:var(--violet)}.acc-big .ck{font-size:10.5px;color:var(--faint);font-weight:600}

  /* 插件分頁內容 */
  .plugin-body{padding:18px}
  .plugin-card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
  .plugin-card h3{font-size:16px;font-weight:750;margin-bottom:6px}
  .plugin-card p{font-size:13px;color:var(--sub);line-height:1.7}
  .plugin-card .lnk{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;color:var(--violet);text-decoration:none;padding:8px 16px;background:var(--violet-soft);border-radius:100px}
  /* === NEXORA 資金流向 tab (規則 24,2026-07-15) === */
  .nexora-host{font-size:0.9rem;color:var(--ink)}
  .nx-banner{background:linear-gradient(135deg,#1a2639 0%,#2c3e50 100%);color:#fff;border-radius:18px;padding:16px 24px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 6px 24px rgba(26,38,57,.2);flex-wrap:wrap;gap:12px}
  .nx-banner-l{display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px}
  .nx-bi{display:flex;align-items:baseline;gap:6px}
  .nx-lbl{font-size:0.7rem;opacity:.7;text-transform:uppercase;letter-spacing:.02em}
  .nx-num{font-size:1.5rem;font-weight:700;line-height:1.2}
  .nx-quads{display:inline-flex;gap:6px;flex-wrap:wrap}
  .nx-quads [class^="quad-mini-"]{padding:3px 12px;border-radius:20px;font-size:0.7rem;font-weight:500}
  .quad-mini-in_up{background:#28a745;color:#fff}.quad-mini-in_down{background:#dc3545;color:#fff}
  .quad-mini-out_up{background:#ffc107;color:#1e293b}.quad-mini-out_down{background:#94a3b8;color:#fff}
  .nx-banner-r{font-size:0.7rem;opacity:.55;letter-spacing:.02em}
  .nx-card{background:var(--card);border-radius:var(--r);padding:18px 22px;box-shadow:var(--shadow);margin-bottom:14px}
  .nx-card-h{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px}
  .nx-card-h>span:first-child{font-size:0.95rem;font-weight:700}
  .nx-sub{color:var(--sub);font-weight:400;font-size:0.78rem}
  .nx-filter{font-size:0.7rem;color:var(--ink);background:#f1f5f9;padding:5px 16px;border-radius:30px;font-weight:400;line-height:1.6}
  .nx-hl{font-weight:700;color:#0f3b7a}
  .nx-dim{color:#64748b;font-weight:400}
  .nx-tbl{margin-bottom:0}
  .nx-tbl th{font-size:0.7rem;font-weight:600;padding:10px 8px;border-bottom:2px solid #e9edf4;color:#475569;text-transform:uppercase;letter-spacing:.02em}
  .nx-tbl td{font-size:0.8rem;padding:10px 8px;vertical-align:middle;border-bottom:1px solid #f1f4f9}
  .nx-tbl tr:hover td{background:#fafcff}
  .nx-quad{padding:3px 10px;border-radius:20px;font-size:0.65rem;font-weight:600}
  .nx-quad-in_up{background:#28a745;color:#fff}.nx-quad-in_down{background:#dc3545;color:#fff}
  .nx-quad-out_up{background:#ffc107;color:#1e293b}.nx-quad-out_down{background:#94a3b8;color:#fff}
  .nx-review-btn{font-size:0.7rem;padding:3px 12px;border-radius:30px;border:1px solid #e2e8f0;background:#fff;color:var(--ink);font-weight:600;transition:all .15s;cursor:pointer}
  .nx-review-btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
  .nx-ai{background:#f0f6ff;border-left:5px solid var(--ink);padding:14px 20px;border-radius:14px;font-size:0.9rem;box-shadow:0 2px 8px rgba(0,0,0,.02)}
  .nx-loading{padding:60px 20px;text-align:center;color:var(--sub);font-size:0.9rem}
  /* 上排雙欄:族群瀏覽 + 時間序列 */
  .nx-row{display:grid;grid-template-columns:5fr 7fr;gap:14px;margin-bottom:14px}
  @media (max-width:900px){.nx-row{grid-template-columns:1fr}}
  .nx-card-tight{padding:16px 18px;margin-bottom:0}
  .nx-sector-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .nx-sector-btn{font-size:0.75rem;padding:4px 14px;border-radius:30px;border:1px solid #e2e8f0;background:#f8fafc;color:#475569;font-weight:500;cursor:pointer;transition:all .15s}
  .nx-sector-btn:hover{background:#eef2f6;border-color:#cbd5e1}
  .nx-sector-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 2px 8px rgba(30,41,59,.15)}
  .nx-stock-list{max-height:280px;overflow-y:auto}
  .nx-stock-item{cursor:pointer;padding:7px 12px;border-radius:8px;border-bottom:1px solid #f1f4f9;font-size:0.85rem;display:flex;align-items:center;justify-content:space-between;transition:background .1s}
  .nx-stock-item:hover{background:#f1f6fe}
  .nx-stock-item.active{background:#e8f0fe;font-weight:500}
  .nx-stock-item .nx-quad{font-size:0.62rem;padding:2px 9px}
  .nx-chart{height:200px;width:100%;margin-top:6px}
  .nx-hist-tbl{font-size:0.75rem;width:100%;margin-top:8px;border-collapse:collapse}
  .nx-hist-tbl th{font-size:0.62rem;padding:6px 4px;border-bottom:1.5px solid #e9edf4;color:#475569;text-align:left;font-weight:600}
  .nx-hist-tbl td{padding:6px 4px;border-bottom:1px solid #f1f4f9}
  /* === NEXORA 結束 === */

  /* 模擬控制(在插件分頁內) */
  .sim{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
  .sbtn{font-size:13px;font-weight:750;padding:8px 16px;border-radius:100px;border:none;cursor:pointer;background:var(--violet);color:#fff}
  .sbtn.g{background:#fff;color:var(--violet);box-shadow:inset 0 0 0 1.5px var(--violet)}
  .spd{display:flex;gap:3px;background:var(--soft);border-radius:100px;padding:3px}
  .spd b{padding:5px 11px;border-radius:100px;font-size:11px;font-weight:700;color:var(--sub);cursor:pointer}
  .spd b.on{background:var(--violet);color:#fff}

  /* Modal */
  .ov{position:fixed;inset:0;background:rgba(15,18,25,.4);z-index:60;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
  .ov.open{display:flex;animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @media(min-width:600px){.ov{align-items:center;padding:24px}}
  .sheet{background:var(--card);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border-radius:26px 26px 0 0;box-shadow:var(--shadow-lg);animation:slideup .28s cubic-bezier(.2,.9,.3,1)}
  @keyframes slideup{from{transform:translateY(40px)}to{transform:translateY(0)}}
  @media(min-width:600px){.sheet{border-radius:26px}}
  .grip{width:38px;height:5px;border-radius:100px;background:var(--line);margin:10px auto 0}
  .sh-h{padding:14px 22px 16px;position:sticky;top:0;background:var(--card);z-index:2}
  .sh-h .snm{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .sh-h .ssub{font-size:12px;color:var(--sub);font-weight:600;margin-top:2px}
  .sv{border-radius:16px;padding:14px 16px;margin-top:12px}
  .sv.buy{background:var(--up-soft)}.sv.sell{background:var(--down-soft)}.sv.watch{background:var(--amber-soft)}.sv.obs{background:var(--soft)}
  .sv .l{font-size:15px;font-weight:750}.sv.buy .l{color:var(--up)}.sv.sell .l{color:var(--down)}.sv.watch .l{color:var(--amber)}
  .sv .d{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.5}
  .sh-b{padding:6px 22px 26px}
  .blk{margin-top:18px}
  .blk-t{font-size:12px;font-weight:750;color:var(--sub);margin-bottom:10px;display:flex;justify-content:space-between}
  .blk-t .r{color:var(--faint);font-weight:600}
  .fac{display:flex;align-items:center;gap:11px;padding:6px 0}
  .fac .fk{width:80px;flex:none;font-size:12.5px;color:var(--sub);font-weight:600;white-space:nowrap}
  .fac .fb{flex:1;height:8px;background:var(--soft);border-radius:100px;overflow:hidden}
  .fac .fb i{display:block;height:100%;border-radius:100px}
  .fac .fv{width:42px;text-align:right;flex:none;font-size:12px;font-weight:750}
  .kv2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .kv2 .c{background:var(--soft);border-radius:13px;padding:12px 14px}
  .kv2 .c .k{font-size:11px;color:var(--faint);font-weight:600}
  .kv2 .c .v{font-size:16px;font-weight:750;margin-top:2px}
  .healbox{border-radius:14px;padding:13px 15px;margin-top:4px}
  .healbox.in_up{background:var(--up-soft)}.healbox.in_down{background:var(--amber-soft)}.healbox.out_up{background:var(--violet-soft)}.healbox.out_down{background:var(--down-soft)}
  .healbox .t{font-size:13px;font-weight:800}.healbox .d{font-size:11.5px;color:var(--sub);margin-top:4px;line-height:1.5}
  .chipbox,.tribox{border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-top:10px}

<script>
function pmEsc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];});}

var STATE=null, HEAT="change", SEL=null, TAB="home";
var ENGINE={"2303":1,"5347":1};
var QN={"in_up":"流入·漲","in_down":"流入·跌","out_up":"流出·漲","out_down":"流出·跌"};
var QN_HELP={"in_up":"順勢主做,最健康","in_down":"邊拉邊賣/假紅出貨疑慮","out_up":"量縮惜售,續航存疑","out_down":"輪動休息日"};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pf(v){if(v==null)return"—";return (v>0?"+":"")+Number(v).toFixed(2)+"%";}
function col(v){return (v||0)>=0?"var(--up)":"var(--down)";}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="toast show";clearTimeout(t._tm);t._tm=setTimeout(function(){t.className="toast";},1600);}

/* treemap */
function colorChange(p){if(p==null)return"#eef0f3";var s=[[3,"#f43f5e"],[1,"#f77e8b"],[.01,"#fbd0d6"],[-.01,"#eef0f3"],[-1,"#bfe8d5"],[-3,"#6bcfa0"],[-99,"#10b981"]];for(var i=0;i<s.length;i++)if(p>=s[i][0])return s[i][1];return"#10b981";}
function colorFlow(f){if(f==null)return"#eef0f3";if(f>=15)return"#f43f5e";if(f>=5)return"#f77e8b";if(f>=.5)return"#fbd0d6";if(f>-.5)return"#eef0f3";if(f>-5)return"#bfe8d5";if(f>-15)return"#6bcfa0";return"#10b981";}
function treemap(items,W,H){
  // [v4 2026-07-15] treemap weight 改 log 壓縮:避免單一爆量族群(記憶體+9.72%)巨格吃掉整個版面、其他細到看不見
  // log1p(weight) / sum → 面積比從「金額比」(可能 100x)壓到 ~3-4x,視覺均勻但仍保排序
  var total=items.reduce(function(a,b){return a+Math.max(.001,Math.log1p(Math.max(0,b.weight)))},0);
  var data=items.map(function(it){return {it:it,area:Math.max(.001,Math.log1p(Math.max(0,it.weight)))/total*W*H}}).sort(function(a,b){return b.area-a.area});
  var rects=[],X=0,Y=0,W2=W,H2=H;
  function worst(row,len){if(!row.length)return Infinity;var s=0,mx=0,mn=Infinity;row.forEach(function(r){s+=r.area;if(r.area>mx)mx=r.area;if(r.area<mn)mn=r.area});var l2=len*len,s2=s*s;return Math.max(l2*mx/s2,s2/(l2*mn));}
  function place(row){var s=0;row.forEach(function(r){s+=r.area});var horiz=W2>=H2,len=horiz?H2:W2,thick=s/len,off=0;row.forEach(function(r){var side=r.area/thick;if(horiz)rects.push({it:r.it,x:X,y:Y+off,w:thick,h:side});else rects.push({it:r.it,x:X+off,y:Y,w:side,h:thick});off+=side});if(horiz){X+=thick;W2-=thick}else{Y+=thick;H2-=thick}}
  var i=0;while(i<data.length){var row=[data[i]],len=Math.min(W2,H2);while(i+1<data.length){if(worst(row.concat([data[i+1]]),len)<=worst(row,len)){row.push(data[i+1]);i++}else break;}place(row);i++;}
  return rects;
}
function secWeight(s){return (s.amount_100m!=null&&s.amount_100m>0)?s.amount_100m:Math.max(1,Math.abs(s.pct||0)+1);}

function renderTop(){
  var m=(STATE.market||{});
  var h='<div class="idx"><div class="k">加權指數</div><div class="v num" style="color:'+col(m.index_pct)+'">'+(m.index!=null?Number(m.index).toLocaleString():"—")+'</div><div class="c" style="color:'+col(m.index_pct)+'">'+pf(m.index_pct)+'</div></div>'
    +'<div class="idx"><div class="k">成交金額</div><div class="v num">'+(m.amount_100m!=null?m.amount_100m+"億":"—")+'</div><div class="c" style="color:var(--faint)">觀察池 '+((STATE.stocks||[]).length)+' 檔</div></div>'
    +'<div class="idx"><div class="k">市場強度</div><div class="v num" style="color:var(--violet)">'+(m.score!=null?m.score:"—")+'</div><div class="c" style="color:var(--faint)">'+(m.mode==="attack"?"攻擊":m.mode==="caution"?"謹慎":"防守")+'</div></div>';
  document.getElementById("idxrow").innerHTML=h;
  document.getElementById("clock").textContent=(m.time||"--:--:--");
  document.getElementById("livetxt").textContent=(STATE.is_market_hours===false?"盤後":"盤中");
}
function renderVerdict(){
  if(!(STATE.sectors||[]).length)return;  // 無資料不動,避免覆蓋上一輪
  var secs=(STATE.sectors||[]).slice().sort(function(a,b){return (b.flow_score||0)-(a.flow_score||0)});
  var top3=secs.filter(function(s){return s.type==="attack"&&s.flow_score>0}).slice(0,3);
  var locked=(STATE.locked_sectors||[]);
  var lead=top3.length?('今日主攻 <em>'+esc(top3[0].name)+'</em>'):'今日無明確主攻族群';
  var sub=top3.length?('資金流入前三:'+top3.map(function(s){return esc(s.name)}).join("、")+'。'):'資金分散,偏防守觀望。';
  if(locked.length)sub+=' 鎖定:'+locked.map(esc).join("、")+'。';
  document.getElementById("verdict").innerHTML='<div class="lead">今日盤面結論</div><div class="big">'+lead+'</div><div class="sub">'+sub+'</div>';
}
function renderTree(){
  document.getElementById("heat-upd").textContent="更新 "+((STATE.market||{}).time||"");
  var tree=document.getElementById("tree");
  // sectors=0 = broker 還沒抓資料,不動 DOM,讓 poll() 顯示「等待盤中資料」
  if(!(STATE.sectors||[]).length)return;
  // 後端偶發重複同 name sectors(開盤 broker race),先 dedupe 取最大 amount_100m 那筆
  var _seen={};var secs=(STATE.sectors||[]).filter(function(s){return secWeight(s)>0}).filter(function(s){
    var k=s.name;if(_seen[k])return false;_seen[k]=true;return true;
  });
  var tree=document.getElementById("tree"),W=tree.clientWidth||600,H=400;
  var rects=treemap(secs.map(function(s){return {name:s.name,weight:secWeight(s),s:s}}),W,H);
  var html="";
  rects.forEach(function(r){
    var s=r.it.s,c=HEAT==="change"?colorChange(s.pct):colorFlow(s.flow_score);
    var val=HEAT==="change"?pf(s.pct):(s.amount_100m!=null?((s.flow_score>=0?"+":"")+s.amount_100m+"億"):pf(s.pct));
    // [缺資料灰格] 後端補齊的 no_data 族群:灰底 + 標示,一眼看出哪組沒抓到(非資金為零)
    var _nd=(s.status==="no_data");
    if(_nd){c="#d8dade";val="資料未取得";}
    var big=Math.min(r.w,r.h);var wlen=0;for(var ci=0;ci<s.name.length;ci++){wlen+=s.name.charCodeAt(ci)>255?1:0.55;}
    // 三段字級策略:大格→正常;小格→降字;極小格→只顯名+轉直書避免空白
    // r.w<46 || r.h<32 視為極小,用旋轉 90° 顯名(短邊方向)
    var tooSmall = r.w<46 || r.h<32;
    var fn = tooSmall ? 10 : Math.max(8, Math.min(17, big/5, (r.w-10)/Math.max(1,wlen)));
    var inner;
    if(tooSmall){
      // 直書:把名字轉 90° 塞窄邊
      inner='<div class="cn" style="font-size:10px;line-height:1.1;writing-mode:vertical-rl;text-orientation:upright;max-height:'+(r.h-6)+'px;overflow:hidden">'+esc(s.name)+'</div>';
    }else{
      // 一般:名字+百分比,字級自適應

/* 盤中資金流動:以族群為第一層,每族群內分進場側/出場側
   - 排序:族群依 flow_score 由高到低(流入強者在前)
   - 個股:進場側按 ai_score 高到低;出場側按 change_rate 低到高
   - 進場 = action∈{buy, watch};出場 = action==="sell"
   - 2026-07-15 規則 24 擴充(已停用):加 container 參數,首頁/NEXORA tab 共用。 */
function renderFlow(targetId, noteId){
  if(!(STATE.sectors||[]).length)return;  // 無資料不動
  if(!targetId)targetId="flowbody";
  if(!noteId)noteId="flow-note";
  // 不論 attack/defend,只要有 amount 或 pct 都列(pct>0 + flow>0 在前,pct<0 在後)
  // dedupe 同名 sector(後端 race 偶發),取 amount_100m 最大那筆
  var _seen={};var rawSectors=(STATE.sectors||[]).filter(function(s){return s.name});
  var secsMap={};rawSectors.forEach(function(s){
    if(!secsMap[s.name]||(s.amount_100m||0)>(secsMap[s.name].amount_100m||0))secsMap[s.name]=s;
  });
  var secs=Object.values(secsMap).sort(function(a,b){return (b.flow_score||0)-(a.flow_score||0)});
  var secByName={};secs.forEach(function(s){secByName[s.name]=s;});
  var secStocks={};
  (STATE.stocks||[]).forEach(function(x){
    if(!x.sector||!secByName[x.sector])return;
    (secStocks[x.sector]=secStocks[x.sector]||[]).push(x);
  });
  var groups=secs.map(function(s){
    var pool=secStocks[s.name]||[];
    var buys=pool.filter(function(x){return x.action==="buy"||x.action==="watch"}).sort(function(a,b){return (b.ai_score||0)-(a.ai_score||0)});
    var sells=pool.filter(function(x){return x.action==="sell"}).sort(function(a,b){return (a.change_rate||0)-(b.change_rate||0)});
    return {sec:s, buys:buys, sells:sells};
  }).filter(function(g){return g.buys.length||g.sells.length;});
  document.getElementById(noteId).textContent = groups.length
    ? ("依族群分組(資金強度排序)· 每族群內上進場 / 下出場")
    : "目前無族群有進出場訊號";
  function frow(s,kind){
    var af=(s.health&&s.health.aflow_ratio!=null&&s.health.aflow_ratio!==0)?s.health.aflow_ratio:null;
    return '<div class="frow '+kind+'" onclick="detail(\''+s.code+'\')"><div class="fstripe"></div>'
      +'<div class="fmain"><div class="fnm">'+esc(s.name)+'</div><div class="fsub">'+esc(s.code)+' · AI '+(s.ai_score!=null?s.ai_score:"—")+(s.bs!=null?' · 內外盤'+s.bs+'%':'')+'</div></div>'
      +'<div class="fflow"><div class="fv '+(af>0?"in":af<0?"out":"")+'">'+(af!=null?((af>0?"+":"")+(af*100).toFixed(0)+"%"):"—")+'</div><div class="fk">主動淨流</div></div>'
      +'<div class="fpx"><div class="v num" style="color:'+col(s.change_rate)+'">'+(s.price!=null?s.price:"—")+'</div><div class="c num" style="color:'+col(s.change_rate)+'">'+pf(s.change_rate)+'</div></div></div>';
  }
  function subZone(kind, arr){
    var h='<div class="sub-zh '+kind+'"><span class="dot"></span><span class="lab">'+(kind==="buy"?"進場":"出場")+'</span><span class="cnt">'+arr.length+' 檔</span></div>';
    h+=arr.length?arr.map(function(s){return frow(s,kind);}).join(""):'<div class="sec-group-empty">此族群暫無'+(kind==="buy"?"進場":"出場")+'訊號</div>';
    return h;
  }
  var html=groups.map(function(g){
    var s=g.sec,flowIn=(s.flow_score||0)>=0;
    var flwTxt=s.amount_100m!=null?((flowIn?"+":"")+s.amount_100m+"億"):(flowIn?"資金流入":"資金流出");
    return '<div class="sec-group">'
      +'<div class="sec-group-h"><span class="gnm">'+esc(s.name)+'</span>'
      +'<span class="gpct" style="color:'+col(s.pct)+'">'+pf(s.pct)+'</span>'
      +'<span class="gflow '+(flowIn?"in":"out")+'">'+flwTxt+'</span>'
      +'<span class="gcnt">'+(g.buys.length+g.sells.length)+' 檔訊號</span></div>'
      +'<div class="sec-group-b">'+subZone("buy",g.buys)+subZone("sell",g.sells)+'</div>'
      +'</div>';
  }).join("");
  document.getElementById(targetId).innerHTML=html||'<div class="empty">目前無族群有進出場訊號</div>';
}

/* 為何上漲:用 sheet 內既有資料(個股 / 族群 / 健康度 / 籌碼)推論原因
   規則(對齊 judge_reason v1):只判「族群跌/個股漲」的逆勢強度;無隨機、無 stock_volume/sector_volume */
function judgeReason(s){
  var stockChg=s.change_rate||0;
  var sec=(STATE.sectors||[]).find(function(x){return x.name===s.sector});
  var sectorChg=sec?sec.pct:0;
  if(!(stockChg>0) || !(sectorChg<0)){
    return {skip:true, reason:"今日非「族群跌、個股漲」格局,不做逆勢分析。個股 "+pf(stockChg)+"、族群 "+pf(sectorChg)+"。"};
  }
  var rel=stockChg-sectorChg;
  var verified=[],failed=[],missing=[];
  var h=s.health||{},cp=s.chip||{};
  // 個股資金淨流 → 用 health.aflow_ratio(主動淨流比)代理
  var aflow=h.aflow_ratio;
  if(aflow==null)missing.push("個股主動淨流");
  else if(aflow>0)verified.push("個股主動淨流 +"+(aflow*100).toFixed(0)+"%");
  else failed.push("個股主動淨流 "+(aflow*100).toFixed(0)+"%");
  // 法人買賣超 → 用 chip.inst_net_20d_lots
  var inst=cp.inst_net_20d_lots;
  if(inst==null)missing.push("法人近月買賣超");
  else if(inst>0)verified.push("法人近月買超 "+(inst>0?"+":"")+inst+" 張");
  else failed.push("法人近月賣超 "+inst+" 張");
  // 主動買盤 → 內外盤 BS(>50% 偏主買)
  var bs=s.bs;
  if(bs==null)missing.push("主動買盤(內外盤)");
  else if(bs>50)verified.push("主動買盤 "+bs+"%(內盤強)");
  else failed.push("主動買盤僅 "+bs+"%");
  // 量比
  var vr=s.volume_ratio;
  if(vr!=null){
    if(vr>=1)verified.push("量比 "+vr.toFixed(2)+",量價同步放大");
    else failed.push("量比僅 "+vr.toFixed(2)+",上漲未放量");
  }
  var available=verified.length+failed.length;
  var status,cls,conclusion;
  if(available<3){
    status="逆勢上漲・資料不足";cls="none";
    conclusion="已確認個股價格逆勢強於族群,但個股資金資料不足,不能判定資金集中。";
  }else if(verified.length>=3){
    status="資金集中型逆勢上漲";cls="good";
    conclusion="個股價格、資金、法人或主動買盤多項同步成立,確認此次上漲具有個股層級資金支持。";
  }else if(verified.length===2){
    status="逆勢上漲・部分資金支持";cls="partial";
    conclusion="個股價格逆勢上漲,但資金訊號未完全同步,不判定為完整資金集中。";
  }else{
    status="價格逆勢・資金未支持";cls="weak";
    conclusion="目前只確認價格逆勢,資金與籌碼數據未支持此次上漲。";
  }
  return {skip:false, status:status, cls:cls, stockChg:stockChg, sectorChg:sectorChg, rel:rel,
           verified:verified, failed:failed, missing:missing, conclusion:conclusion};
}
/* 最終結論:把五因子+個股/族群/籌碼 翻成人話,標籤 + 原因 + 操作建議 */
function buildConclusion(s,fc,h,cp,sec,secChg){
  var chg=s.change_rate||0, vr=s.volume_ratio;
  var aflow=h.aflow_ratio, inst=cp?(cp.inst_net_20d_lots||0):null;
  var above_avg=s.avg_price && s.price && s.price>=s.avg_price;
  var priceWeak=(chg<0 && !above_avg);                  // 價格弱(跌+破均)
  var trendWeak=fc.trend<10;                            // 趨勢<10/25
  var rsWeak=fc.rs<8;                                   // RS<8/20
  var sectorWeak=fc.sector<5;                           // 族群<5/10
  var volumeKiller=(fc.volume===0 && (s.penalties||[]).some(function(p){return p.indexOf("爆量殺盤")>=0;}));
  // 籌碼是否撐得住(>=15/20 算強,10-14 中性,<=9 弱)
  var chipStrong=fc.chip>=15, chipMid=fc.chip>=10, chipWeak=fc.chip<=9 && fc.chip>0;

  // ── 規則分桶 ──
  // A) 強烈避免:跌+破均 + 趨勢/RS/族群 都弱 + 量能沒撐 → 休息/退潮
  if(priceWeak && trendWeak && rsWeak && sectorWeak){
    var lines=[];
    lines.push("價格大跌並跌破均價線,趨勢、相對強度與族群均轉弱。");
    if(vr!=null)lines.push("量比 "+vr.toFixed(2)+",未出現明確放量承接;量能對多方為負貢獻。");
    if(inst!=null)lines.push("近月法人"+(inst>0?"買超":"賣超或不足")+",不足以抵消今日價格結構轉弱。");
    if(aflow!=null && aflow<0)lines.push("主動淨流比 "+(aflow*100).toFixed(0)+"%,賣壓尚未消化。");
    return {label:"避免進場 / 休息退潮",color:"var(--down)",border:"var(--down)",
            body:lines.join("<br>"), action:"不接刀,等待重新站回均價線與族群轉強。"};
  }
  // B) 量價背離警示:漲+破均 + 量縮 → 邊拉邊出貨
  if(chg>0 && !above_avg && vr!=null && vr<1){
    return {label:"邊拉邊賣警戒",color:"var(--amber)",border:"var(--amber)",
            body:"股價小漲但跌破均價線,量比 "+vr.toFixed(2)+" 未跟上,主力可能邊拉邊出貨。",
            action:"不追價,等放量站回均線再說。"};
  }
  // C) 爆量殺盤(獨立情境)
  if(volumeKiller){
    return {label:"爆量殺盤",color:"var(--down)",border:"var(--down)",
            body:"放量下跌且破均線,典型爆量殺盤訊號;量能對多方為負貢獻。",
            action:"不接刀,等待量縮止穩 + 重新站回均線。"};
  }
  // D) 強烈進場:漲+站均 + 趨勢/RS 強 + 籌碼支持
  if(chg>0 && above_avg && fc.trend>=15 && fc.rs>=15 && chipStrong){
    return {label:"強烈進場訊號",color:"var(--up)",border:"var(--up)",
            body:"站上均價線,趨勢與相對強度均強,法人/大戶籌碼支持,進場條件齊備。",
            action:"可進場,停損設在建議價,跌破無條件出。"};
  }
  // E) 觀察:結構到位但籌碼或量能未蓋章
  if(chg>0 && above_avg && fc.trend>=10 && fc.rs>=8){
    var l2=["結構到位(站均線、趨勢/RS 正面)。"];
    if(fc.chip<10)l2.push("籌碼面未蓋章,法人/大戶尚未明顯表態。");
    if(fc.volume<15)l2.push("量能未充分放大,等量比 ≥ 1.5 確認。");
    return {label:"高潛力觀察",color:"var(--violet)",border:"var(--violet)",
            body:l2.join("<br>"), action:"列入觀察,等量能與法人蓋章再進場。"};
  }
  // F) 中性/普通
  var ln3=[];
  if(chg>0 && above_avg) ln3.push("股價站上均線,但趨勢強度有限。");
  if(chg>0 && !above_avg) ln3.push("股價小漲但仍在均線下,動能不穩。");
  if(chg<0 && above_avg) ln3.push("股價小跌但仍站均線,等待方向確認。");
  if(chg<0 && !above_avg) ln3.push("股價跌且破均線,趨勢轉弱。");
  if(ln3.length===0) ln3.push("今日格局不明確,缺乏明確方向。");
  return {label:"中性觀察",color:"var(--sub)",border:"var(--line)",
          body:ln3.join("<br>"), action:"無明確進場訊號,持續觀察。"};
}

    +'<div class="lab">漲跌幅</div><div class="v '+(s.change_rate>0?"up":s.change_rate<0?"down":"")+'">'+pf(s.change_rate)+'</div><div class="v '+(secChg>0?"up":secChg<0?"down":"")+'">'+(secChg!=null?pf(secChg):"—")+'</div>'
    +'<div class="lab">量能(量比)</div><div class="v">'+(s.volume_ratio!=null?s.volume_ratio.toFixed(2):"—")+'</div><div class="v">'+(sec&&sec.flow_score!=null?(sec.flow_score>=0?"+":"")+sec.flow_score:"—")+'</div>'
    +'<div class="lab">資金流向</div><div class="v '+(h.aflow_ratio>0?"up":h.aflow_ratio<0?"down":"")+'">'+(h.aflow_ratio!=null?((h.aflow_ratio>0?"+":"")+(h.aflow_ratio*100).toFixed(0)+"% 主動淨流"):"—")+'</div><div class="v '+(sec&&sec.flow_score>0?"up":sec&&sec.flow_score<0?"down":"")+'">'+(sec?(sec.flow_score>=0?"資金流入":"資金流出"):"—")+'</div>'
    +(rel!=null?('<div class="lab">相對強度</div><div class="diff '+(rel>0?"pos":"neg")+'">'+(rel>0?"+":"")+rel.toFixed(2)+' pp</div><div class="v" style="color:var(--faint)">vs 族群</div>'):"")
    +'</div>'+(noteRel?'<div class="cmpbox-note">📝 '+esc(noteRel)+'</div>':'')+'</div>';

  // ③ 五大因子(卡片式 + 因子小字說明)
  if(fc.trend!=null){
    var fn=s.factor_notes||{};
    function facCard(name,raw,max,help,note){
      var pct=Math.round((raw/max)*100);
      var c=pct>=75?"var(--up)":pct>=55?"var(--violet)":pct>=40?"var(--amber)":"var(--down)";
      var cls=pct>=70?"hot":pct<=30?"cold":"mid";
      return '<div class="faccard '+cls+'"><div class="fk">'+name+' <span class="help" title="'+esc(help)+'">?</span></div>'
        +'<div class="fv" style="color:'+c+'">'+Math.round(raw)+' <span style="font-size:11px;color:var(--faint);font-weight:600">/ '+max+'</span></div>'
        +'<div class="fbar"><i style="width:'+pct+'%;background:'+c+'"></i></div>'
        +(note?'<div class="fnote">'+esc(note)+'</div>':'')+'</div>';
    }
    m+='<div class="cmpbox" style="margin-top:10px"><div class="t">🎯 五大因子 <span style="margin-left:auto;font-size:12px;color:var(--violet);font-weight:800">AI '+(s.ai_score||0)+'</span></div>'
      +'<div class="facgrid">'
      +facCard("趨勢",fc.trend,25,"看均價線/今高/昨高 — 三項技術位置綜合",fn.trend)
      +facCard("量能",fc.volume,25,"量價同向:漲+站均線+放量才給高分,跌+破均線+爆量反扣分",fn.volume)
      +facCard("相對強度",fc.rs,20,"個股 vs 族群 / 個股 vs 大盤 的漲跌幅差距",fn.rs)
      +facCard("籌碼",fc.chip,20,"法人近月買賣超 + 連買天數 + 千張大戶趨勢",fn.chip)
      +facCard("族群",fc.sector,10,"今日是否為攻擊部隊 + 是否被系統鎖定",fn.sector)
      +'</div></div>';
  }

  // ③.5 最終結論(規則:不得只顯示數字;用條件組合給人類可讀結論)
  if(fc.trend!=null){
    var concl=buildConclusion(s,fc,h,cp,sec,secChg);
    m+='<div class="cmpbox" style="margin-top:10px;border-left:4px solid '+concl.border+'">'
      +'<div class="t">📌 最終結論 <span style="margin-left:auto;font-size:13px;font-weight:800;color:'+concl.color+'">'+esc(concl.label)+'</span></div>'
      +'<div style="margin-top:8px;font-size:12px;line-height:1.7;color:var(--ink)">'+concl.body+'</div>'
      +(concl.action?'<div class="nx" style="margin-top:8px">操作:'+esc(concl.action)+'</div>':'')
      +'</div>';
  }

  // ④ 停損 / BS 盤(一句人話寫在 cmpbox 下方)
  var noteBS=(s.bs!=null)?("全場累積外盤買入佔 "+s.bs+"% — "+(s.bs>60?"買盤強勢主導":s.bs>50?"買盤略勝,多空拉鋸中買方稍佔優":s.bs>40?"賣盤略佔優,留意反轉":"賣壓明顯,買方退場")):null;
  var noteStop=(s.suggested_stop!=null)?("跌破此價代表進場理由失效,紀律出場 — 通常設在均線下緣或前低"):null;
  m+='<div class="cmpbox" style="margin-top:10px"><div class="t">🛡 執行紀律</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px">'
    +'<div><div style="font-size:10.5px;color:var(--faint);font-weight:600">建議停損</div><div style="font-size:16px;font-weight:800;color:var(--down);margin-top:2px">'+(s.suggested_stop!=null?s.suggested_stop:"—")+'</div></div>'
    +'<div><div style="font-size:10.5px;color:var(--faint);font-weight:600">內外盤 BS</div><div style="font-size:16px;font-weight:800;color:'+(s.bs>50?"var(--up)":s.bs<50?"var(--down)":"var(--ink)")+';margin-top:2px">'+(s.bs!=null?s.bs+"%":"—")+'</div></div>'
    +'</div>'+((noteBS||noteStop)?'<div class="cmpbox-note">📝 '+(noteStop?esc(noteStop):'')+(noteStop&&noteBS?' ｜ ':'')+(noteBS?esc(noteBS):'')+'</div>':'')+'</div>';
  // ⑤ 為何上漲(族群關係結論)
  m+=whyBlock(s);

  // ⑥ 籌碼細節(部分欄位缺也要顯示;全空才標無資料)
  var noteChip=null;
  if(cp){
    m+='<div class="cmpbox" style="margin-top:10px"><div class="t">💼 籌碼面</div>';
    var hasInst=cp.inst_net_20d_lots!=null, hasStreak=cp.inst_streak!=null,
        hasBigPct=cp.big_holder_pct!=null, hasBigTr=cp.big_holder_trend!=null;
    var anyChip=hasInst||hasStreak||hasBigPct||hasBigTr;
    if(anyChip){
      if(hasInst||hasStreak){
        m+='<div class="ln">法人近月買超 <b class="'+(hasInst&&cp.inst_net_20d_lots>=0?"pos":hasInst?"neg":"")+'">'
          +(hasInst?(cp.inst_net_20d_lots>0?"+":"")+cp.inst_net_20d_lots+" 張":"—")
          +'</b> ｜ 外資連買 '+(hasStreak?cp.inst_streak+" 日":"—")+'</div>';
      } else {
        m+='<div class="ln neu">⚠ 法人買賣超 FinMind 未回傳</div>';
      }
      if(hasBigPct||hasBigTr){
        m+='<div class="ln">千張大戶 '+(hasBigPct?cp.big_holder_pct+"%":"—")
          +'（趨勢 '+(hasBigTr?(cp.big_holder_trend>0?"+":"")+cp.big_holder_trend+"pp":"—")+'）</div>';
      } else {
        m+='<div class="ln neu">⚠ 千張大戶 FinMind 需付費層(免費層無股權分散表)</div>';
      }
      var instDir=hasInst?(cp.inst_net_20d_lots>0?"法人站在買方":cp.inst_net_20d_lots<0?"法人站在賣方":"法人持平觀望"):null;
      var streakDir=hasStreak?(cp.inst_streak>=3?"外資連買 "+cp.inst_streak+" 日偏多":cp.inst_streak<=-3?"外資連賣 "+(cp.inst_streak*-1)+" 日偏空":"外資無明顯連續方向"):null;
      var bigDir=hasBigTr?(cp.big_holder_trend>0?"大戶在偷偷累積籌碼":cp.big_holder_trend<0?"大戶悄悄退場":"大戶持平"):null;
      noteChip=[instDir,streakDir,bigDir].filter(Boolean).join(" ｜ ");
    } else {
      m+='<div class="ln neu">⚠ FinMind 該股全無資料 — 三角驗證此維度不計</div>';
    }
    m+=(noteChip?'<div class="cmpbox-note">📝 '+esc(noteChip)+'</div>':'')+'</div>';
  }

  // ⑦ 三角交叉驗證
  if(t.verdict){var vn={bullish:"偏多",bearish:"偏空",pending:"等待確認"}[t.verdict];
    m+='<div class="cmpbox" style="margin-top:10px"><div class="t">🔺 三角交叉驗證 <span class="vd '+t.verdict+'">'+vn+(t.strength&&t.strength!=="—"?" "+t.strength:"")+'</span></div>';
    if(t.log){if(t.log.positive&&t.log.positive.length)m+='<div class="ln"><span class="pos">✓ '+t.log.positive.map(esc).join(" ｜ ")+'</span></div>';if(t.log.negative&&t.log.negative.length)m+='<div class="ln"><span class="neg">✗ '+t.log.negative.map(esc).join(" ｜ ")+'</span></div>';if(t.log.neutral&&t.log.neutral.length)m+='<div class="ln"><span class="neu">– '+t.log.neutral.map(esc).join(" ｜ ")+'</span></div>';}
    m+='<div class="ln neu">'+esc(t.conflict||"")+'</div>'+(t.next_signal?'<div class="nx">下一驗證:'+esc(t.next_signal)+'</div>':'')+'</div>';}

  // ⑧ 文件四大策略(對比用 + 一句人話寫在 cmpbox 下方)
  if(ds){var yn=function(b){return b?'<span class="pos">✓</span>':'<span class="neg">✗</span>';};
    var passCnt=(ds.c1_market?1:0)+(ds.c2_chip?1:0)+(ds.c3_tech?1:0)+(ds.c4_bs?1:0);
    var noteDS="四大條件過 "+passCnt+"/4 項"+(ds.pass?" — 全部到位,符合文件進場標準":passCnt>=2?" — 多數成立,可考慮進場":passCnt>=1?" — 僅少數成立,建議續觀":" — 全數未過,不符合文件標準,跳過");
    m+='<div class="cmpbox" style="margin-top:10px"><div class="t">📋 文件四大策略 <span class="vd '+(ds.pass?"bullish":"pending")+'">'+(ds.pass?"通過":ds.score+"分")+'</span></div><div class="ln" style="margin-top:6px">'+yn(ds.c1_market)+' 大盤 ｜ '+yn(ds.c2_chip)+' 籌碼 ｜ '+yn(ds.c3_tech)+' 技術MA20 ｜ '+yn(ds.c4_bs)+' BS盤</div><div class="cmpbox-note">📝 '+esc(noteDS)+' ｜ 與AI分並列驗證誰準</div></div>';}

  // ⑨ 規則徽章
  if(s.rules&&s.rules.length)m+='<div class="rules" style="margin-top:12px">'+s.rules.map(function(r){return '<span class="r">'+esc(r)+'</span>'}).join("")+'</div>';

  m+='</div>';
  document.getElementById("sheet").innerHTML=m;
  document.getElementById("ov").className="ov open";
}

/* ── [按鈕防護層] switchTab 外層包裝:任何分頁 render 出錯都不讓按鈕失效 ──
   根因防護:即使某輪資料異常導致分頁內部 throw,按鈕點擊仍有回應,
   不會出現「按鈕點了沒反應/整頁卡死」。原邏輯完整保留於 _switchTabImpl。 */
function switchTab(tab){
  try{
    _switchTabImpl(tab);
  }catch(e){
    if(window.console)console.log("switchTab/"+tab,e&&e.message);
    // 分頁內容失敗時,至少把高亮切過去 + 提示,不讓使用者以為按鈕壞了
    try{document.querySelectorAll(".tab").forEach(function(b){b.className="tab"+(b.getAttribute("data-tab")===tab?" on":"")});}catch(_){}
    try{if(typeof toast==="function")toast("此分頁暫時無法載入,資料回穩後再試");}catch(_){}
  }
}
function _switchTabImpl(tab){
  TAB=tab;
  document.querySelectorAll(".tab").forEach(function(b){b.className="tab"+(b.getAttribute("data-tab")===tab?" on":"")});
  var home=document.getElementById("page-home"),plug=document.getElementById("page-plugin"),pm=document.getElementById("page-premarket");
  pm.style.display="none";
  if(tab==="home"){home.style.display="";plug.style.display="none";return;}
  if(tab==="premarket"){home.style.display="none";plug.style.display="none";pm.style.display="";renderPmReport();return;}
  home.style.display="none";plug.style.display="";
  var body=document.getElementById("plugin-body");
  if(tab==="sim"){
    body.innerHTML='<div class="plugin-card"><h3>⚙️ 模擬 / 設定</h3><p>盤後或非交易時段,可用模擬資料讓畫面跑動測試 UI。實際上線接 Shioaji 即時 /api/state。</p>'
      +'<div class="sim"><button class="sbtn" id="playbtn" onclick="toggleSim()">▶ 開始模擬</button><button class="sbtn g" onclick="stepSim()">下一步</button><button class="sbtn g" onclick="resetSim()">停止</button>'
      +'<div class="spd"><b data-s="2000" onclick="setSpeed(2000)">慢</b><b class="on" data-s="1000" onclick="setSpeed(1000)">中</b><b data-s="400" onclick="setSpeed(400)">快</b></div></div>'
      +'<p style="margin-top:10px">狀態:<b id="simstat">'+(simOn?"模擬中":"即時 /api/state")+'</b></p></div>';
    return;
  }
  if(tab==="health"){renderHealthTab();return;}
  if(tab==="livermore"){renderLivermoreTab();return;}
  if(tab==="nexora"){body.innerHTML='<div class="plugin-card"><h3>🧠 NEXORA</h3><p>本模組盤後報告已停用,只保留按鈕入口。</p><p style="color:var(--faint);font-size:12px;margin-top:10px">資料與分析改由「盤前」「盤後」分頁呈現。</p></div>';return;}
  var p=PLUGINS[tab];
  if(p){body.innerHTML='<div class="plugin-card"><h3>'+p.t+'</h3><p>'+p.d+'</p>'+(p.link?'<a class="lnk" href="'+p.link+'" target="_blank">開啟 '+p.link+' ↗</a>':'<p style="color:var(--violet);font-weight:700;margin-top:10px">→ 回首頁點任一個股卡片,細節彈窗即含此插件分析</p>')+'</div>';}
}

function healthDetail(code){

  function fl(v,u){return v!=null?((v>0?"+":"")+v.toLocaleString()+(u||"")):"無資料";}
  var rows=[
    ["四象限", q[0]+" — "+q[2]],
    ["健康分", (it.score!=null?it.score:"—")+" / 100(四腳合成)"],
    ["技術面", (m.price!=null?m.price:"—")+" · 收"+(it.price!=null?it.price:"—")+" 量比"+(it.volume_ratio!=null?it.volume_ratio:"—")],
    ["資金面", (m.flow!=null?m.flow:"—")+((it.aflow_ratio!=null&&it.aflow_ratio!==0)?" · 主動淨流"+(it.aflow_ratio*100).toFixed(0)+"%":" · 盤後無主動買賣量(中性)")],
    ["籌碼面", (m.chip!=null?m.chip:"—")+" · 法人近月"+fl(it.inst_net_20d_lots,"張")+(it.inst_streak?" 連買"+it.inst_streak+"日":"")],
    ["族群相對", (m.sector!=null?m.sector:"—")+(it.rs_vs_sector!=null?" · 個股"+pf(it.change_rate)+" vs 族群"+pf(it.sector_pct)+"("+(it.rs_vs_sector>=0?"強+":"弱")+it.rs_vs_sector+"pp)":"")],
    ["資金連續", (it.flow_streak!=null?it.flow_streak+" 日":"—")+(it.health_trend?" · 趨勢 "+it.health_trend:"")],
    ["千張大戶", (it.big_holder_pct!=null?it.big_holder_pct+"%":"無資料")+(it.big_holder_trend!=null?" · 週趨勢"+(it.big_holder_trend>0?"+":"")+it.big_holder_trend+"pp":"")]
  ];
  var h='<div class="hpop-c"><div class="hpop-h"><b>'+pmEsc(it.name)+' '+pmEsc(it.code)+'</b><span class="hz-tag '+q[1]+'">'+pmEsc(q[0])+'</span><i onclick="document.getElementById(\'hpop\').style.display=\'none\'">✕</i></div>';
  rows.forEach(function(r){h+='<div class="hpop-r"><span class="hpop-k">'+r[0]+'</span><span class="hpop-v">'+pmEsc(r[1])+'</span></div>';});
  h+='<div class="hpop-note">盤後價格:官方 TWSE/TPEx；法人/籌碼依各來源公布日期；主動買賣量盤後不提供即標示中性，不以舊資料冒充今日。</div></div>';
  var pop=document.getElementById("hpop"); pop.innerHTML=h; pop.style.display="flex";
}
function pmRender(txt){
  var lines=String(txt||"").split(/\r?\n/),html="",tbl=null;
  function flush(){if(tbl){html+='<div class="pmtbl-x"><table class="pmtbl">'+tbl.rows.map(function(r,i){
      return '<tr>'+r.map(function(c){return (i===0?'<th>':'<td>')+ (i===0?pmEsc(c):pmGrade(c)) +(i===0?'</th>':'</td>');}).join("")+'</tr>';
    }).join("")+'</table></div>';tbl=null;}}
  lines.forEach(function(ln){
    var t=ln.trim();
    var isRow=(t.indexOf("｜")>-1)||(/^\|.*\|$/.test(t));
    if(isRow){
      var cells=t.indexOf("｜")>-1?t.split("｜"):t.replace(/^\||\|$/g,"").split("|");
      cells=cells.map(function(c){return c.trim();});
      if(cells.every(function(c){return /^[-:\s]*$/.test(c);}))return; // md 分隔線
      if(!tbl)tbl={rows:[]};
      tbl.rows.push(cells);return;
    }
    flush();
    if(!t){return;}
    if(/^#{1,3}\s/.test(t)){html+='<h3>'+pmEsc(t.replace(/^#{1,3}\s*/,""))+'</h3>';}
    else{html+='<p>'+pmEsc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')+'</p>';}
  });
  flush();return html||'<p>(空白報告)</p>';
}
function loadPm(){
  var el=document.getElementById("pmblock");if(!el)return;  // 元素不存在時不跑(切到 premarket tab 才會 render)
  fetch("/api/premarket/latest").then(function(r){return r.json();}).then(function(d){
    PM=d;
    var btn='<button class="pm-btn" onclick="runPm(0)">產生今日報告</button>';
    if(d&&d.report_date===new Date().toISOString().slice(0,10)) btn='<button class="pm-btn g" onclick="runPm(1)">重新產生</button>';
    if(!d||!d.content){
      el.innerHTML='<div class="pm-row"><span class="pm-d">尚無報告</span><span class="pm-s">開盤前按右側按鈕產生</span>'+btn+'</div>'
        +(!d.key_ready?'<div class="pm-key">⚠ 尚未設定 OPENAI_API_KEY(.env 留有空位,填入後重啟即可)</div>':'');
      var u=document.getElementById("pm-upd");if(u)u.textContent="";return;
    }
    var prev=String(d.content).split(/\r?\n/).filter(function(x){return x.trim();}).slice(0,3).join(" / ");
    el.innerHTML='<div class="pm-row"><span class="pm-d">'+pmEsc(d.report_date)+'</span><span class="pm-s">'+pmEsc(d.model||"")+(d.context_note==="us_missing"?" · 美股資料缺":"")+'</span>'+btn
      +'<button class="pm-btn g" onclick="switchTab(\'premarket\')">看完整報告 ▸</button></div>'
      +'<div class="pm-prev">'+pmEsc(prev)+'</div>'
      +(!d.key_ready?'<div class="pm-key">⚠ OPENAI_API_KEY 未設定</div>':'');
    var u=document.getElementById("pm-upd");if(u)u.textContent=d.report_date;
  }).catch(function(){if(el)el.innerHTML='<div class="pm-empty">連線失敗</div>';});
}
function renderPmReport(){
  var el=document.getElementById("pmreport");
  if(!PM||!PM.content){el.innerHTML='<p>尚無盤前報告。請按下方按鈕「產生今日報告」。</p>'
    +(PM&&!PM.key_ready?'<p style="color:var(--amber);font-weight:700">⚠ 需先在 .env 填入 OPENAI_API_KEY(程式已留空位)。</p>':'');return;}
  el.innerHTML='<h3>🌅 盤前報告 · '+pmEsc(PM.report_date)+'</h3>'+pmRender(PM.content);
}
function runPm(force){
  toast("盤前報告產生中(蒐集資料 → OpenAI)…");
  fetch("/api/premarket/run?force="+force,{method:"POST"}).then(function(r){return r.json();}).then(function(d){
    if(d.ok){toast("完成:"+(d.note||d.date));loadPm();}
    else{toast("失敗");alert(d.error||"產生失敗");}
  }).catch(function(e){toast("失敗:"+e);});
}
loadPm();

/* ── 三大法人 banner(官方 TWSE,盤後日更) ── */
function loadMktBanner(){
  fetch("/api/market/official").then(function(r){return r.json();}).then(function(d){
    var el=document.getElementById("mktbanner");if(!el)return;
    var i=(d&&d.institutional)||{},x=(d&&d.index)||{};
    function b(v){return (typeof v==="number")?(v>=0?"+":"")+v.toFixed(1):"—";}
    function cls(v){return (typeof v==="number")?(v>0?"up":(v<0?"dn":"")):"";}
    if(i.foreign_100m==null&&i.note){el.innerHTML='<div class="mb-note">三大法人:'+pmEsc(i.note)+'</div>';return;}
    var taiex=(typeof x.taiex==="number")?x.taiex.toLocaleString():"—";
    el.innerHTML=
      '<div class="mb-idx">加權指數 <b>'+taiex+'</b> <span class="'+cls(x.change_pct)+'">'+b(x.change_pct)+'%</span></div>'
      +'<div class="mb-inst">'
      +'<span>外資 <b class="'+cls(i.foreign_100m)+'">'+b(i.foreign_100m)+'</b>億</span>'
      +'<span>投信 <b class="'+cls(i.trust_100m)+'">'+b(i.trust_100m)+'</b>億</span>'
      +'<span>自營 <b class="'+cls(i.dealer_100m)+'">'+b(i.dealer_100m)+'</b>億</span>'
      +'<span>合計 <b class="'+cls(i.total_100m)+'">'+b(i.total_100m)+'</b>億</span>'
      +'</div><div class="mb-src">官方 TWSE · '+pmEsc(i.date||"")+'</div>';
  }).catch(function(){});
}

/* ── 四關漏斗(已從首頁移除,盤後報告僅留於「盤前」「盤後」分頁) ── */

/* 模擬引擎(簡化:對現有 STATE 加雜訊,盤後測試用) */
var simOn=false,simTimer=null,simSpeed=1000;
function simStep(){
  if(!STATE||!STATE.stocks)return;
  STATE.stocks.forEach(function(s){s.change_rate=(s.change_rate||0)+(Math.random()-0.48)*0.4;if(s.price)s.price=Math.round(s.price*(1+(Math.random()-0.5)*0.006)*100)/100;s.volume_ratio=Math.max(0.3,(s.volume_ratio||1)+(Math.random()-0.5)*0.1);});
  (STATE.sectors||[]).forEach(function(g){g.pct=(g.pct||0)+(Math.random()-0.48)*0.3;g.flow_score=(g.flow_score||0)+(Math.random()-0.5)*2;});
  renderHome();var ss=document.getElementById("simstat");if(ss)ss.textContent="模擬中 · tick";
}
function toggleSim(){simOn=!simOn;var b=document.getElementById("playbtn");if(simOn){if(b)b.textContent="⏸ 暫停";simTimer=setInterval(simStep,simSpeed);toast("模擬開始");}else{if(b)b.textContent="▶ 開始模擬";clearInterval(simTimer);toast("暫停");}}
function stepSim(){simStep();toast("前進一步");}
function resetSim(){simOn=false;clearInterval(simTimer);var b=document.getElementById("playbtn");if(b)b.textContent="▶ 開始模擬";poll();toast("回到即時");}
function setSpeed(ms){simSpeed=ms;document.querySelectorAll(".spd b").forEach(function(x){x.className=(parseInt(x.getAttribute("data-s"),10)===ms?"on":"")});if(simOn){clearInterval(simTimer);simTimer=setInterval(simStep,simSpeed);}}

function renderHome(){
  // 5 個板塊各自獨立 try/catch,任何一個爆不影響後面,也不要清空整頁
  var sections=[
    {fn:renderTop,     name:"top"},
    {fn:renderVerdict, name:"verdict"},
    {fn:renderTree,    name:"tree"},
    {fn:renderFlow,    name:"flow"},
    {fn:renderMini,    name:"mini"}
  ];
  for(var i=0;i<sections.length;i++){
    try{sections[i].fn();}
    catch(e){
      if(window.console)console.log("render/"+sections[i].name,e&&e.message);
      // 只在對應板塊顯示小錯誤,不動其他板塊
      try{
        if(sections[i].name==="tree"){document.getElementById("tree").innerHTML='<div class="empty" style="height:100%;display:flex;align-items:center;justify-content:center;color:var(--faint)">熱力圖載入失敗,個股板塊仍可用</div>';}
      }catch(_){}
    }
  }
}
function poll(){
  if(simOn)return;
  fetch("/api/state").then(function(r){return r.json()}).then(function(d){
    if(d.status==="starting"){return;}  // 不動熱力圖,讓各板塊 fallback 處理
    STATE=d;
    // sectors 0 = 開盤 broker 還沒抓到,個股板塊照 render,熱力圖顯示等待
    renderHome();
    if(!(STATE.sectors||[]).length){
      var t=document.getElementById("tree");
      if(t&&!t.querySelector(".empty"))t.innerHTML='<div class="empty" style="height:100%;display:flex;align-items:center;justify-content:center;color:var(--faint)">等待盤中資料…</div>';
    }
  }).catch(function(){
    // 連線失敗時只動熱力圖(避免誤導使用者以為整個系統死掉)
    var t=document.getElementById("tree");
    if(t)t.innerHTML='<div class="empty" style="height:100%;display:flex;align-items:center;justify-content:center;color:var(--faint)">連線失敗,個股板塊仍可用</div>';
  });
}
// 分頁按鈕事件綁定:HTML 使用 data-tab,需明確轉呼叫 switchTab。
document.querySelectorAll(".tab").forEach(function(b){
  b.addEventListener("click",function(){switchTab(b.getAttribute("data-tab"));});
});
window.addEventListener("resize",function(){if(STATE&&TAB==="home")renderTree();});
setInterval(poll,30000);poll();
</script>
