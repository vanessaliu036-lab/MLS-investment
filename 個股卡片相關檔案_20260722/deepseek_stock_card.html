<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MLS 個股決策中心</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--line:#dfe5ef;--soft:#f8fafc;--text:#172033;--muted:#6d778a;--green:#0a9b70;--green-bg:#eaf8f3;--red:#e6465a;--red-bg:#fff0f2;--amber:#b77a08;--amber-bg:#fff7df;--blue:#3867d6;--blue-bg:#eef3ff;--navy:#111a2e;--shadow:0 10px 26px rgba(25,42,70,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.topbar{height:58px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:3}.brand{font-weight:900;letter-spacing:.08em}.topbar-note{color:#b8c1d4;font-size:12px}.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;max-width:1720px;margin:auto;padding:18px}.sidebar{position:sticky;top:76px;align-self:start;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.sidebar-head{padding:18px;border-bottom:1px solid var(--line)}.sidebar-head h2{font-size:14px;margin:0 0 5px}.sidebar-head p{margin:0;color:var(--muted);font-size:12px}.stock-list{padding:10px;max-height:70vh;overflow:auto}.stock-btn{width:100%;border:1px solid transparent;background:transparent;text-align:left;border-radius:14px;padding:13px;cursor:pointer;margin-bottom:8px}.stock-btn:hover{background:var(--soft)}.stock-btn.active{background:var(--blue-bg);border-color:#c8d6ff}.stock-btn-top{display:flex;justify-content:space-between;gap:8px}.stock-code{font-size:12px;color:var(--muted);font-weight:800}.stock-name{font-weight:900;font-size:17px}.stock-score{font-weight:900;color:var(--blue)}.stock-meta{display:flex;gap:8px;margin-top:7px;font-size:12px;color:var(--muted)}.main{min-width:0}.hero,.section{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}.hero-main{display:grid;grid-template-columns:1.4fr .65fr 1.15fr;min-height:190px}.hero-block{padding:24px;border-right:1px solid var(--line)}.hero-block:last-child{border-right:0}.identity{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.code{font-size:14px;color:var(--muted);font-weight:800}.name{font-size:32px;font-weight:950}.tag{padding:5px 10px;border-radius:999px;background:#eef1f6;color:#5d6678;font-size:12px;font-weight:800}.stars{font-size:24px;color:#d89800;margin:8px 0}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick .q{padding:10px 7px;border:1px solid var(--line);border-radius:11px;background:var(--soft);text-align:center}.q label{display:block;color:var(--muted);font-size:11px}.q b{font-size:16px}.pos{color:var(--red)}.neg{color:var(--green)}.warn{color:var(--amber)}.decision{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.score{width:82px;height:82px;border-radius:22px;background:var(--amber-bg);color:var(--amber);display:grid;place-items:center;font-size:28px;font-weight:900}.decision h2{margin:9px 0 0;font-size:25px}.decision p{font-size:12px;color:var(--muted);margin:3px 0}.state{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--amber-bg);color:var(--amber);font-size:12px;font-weight:900}.funnel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:center;height:100%}.layer{border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center;background:var(--soft)}.layer.pass{border-color:var(--green);background:var(--green-bg)}.layer.pass .v{color:var(--green)}.layer.fail{border-color:var(--red);background:var(--red-bg)}.layer.fail .v{color:var(--red)}.layer .k{font-size:11px;color:var(--muted);font-weight:800}.layer .v{font-size:15px;font-weight:900;margin:4px 0}.layer .d{font-size:10px;color:var(--muted)}.factors{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line)}.factor{padding:13px 8px;text-align:center;border-right:1px solid var(--line)}.factor:last-child{border-right:0}.factor .head{font-size:11px;font-weight:900}.factor .num{font-size:25px;color:var(--blue);font-weight:900}.bar{height:6px;background:#e9edf5;border-radius:99px;overflow:hidden;max-width:130px;margin:4px auto}.bar i{display:block;height:100%;background:var(--blue)}.factor p{font-size:10px;color:var(--muted);margin:4px 0 0}.section-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.section-title{font-size:17px;font-weight:950}.source{font-size:11px;color:var(--muted);font-weight:800}.section-body{padding:16px 18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}.card h3{font-size:14px;margin:0;padding:12px 14px;background:var(--soft);border-bottom:1px solid var(--line)}.rows{padding:5px 14px}.row{display:grid;grid-template-columns:1fr auto;gap:14px;padding:9px 0;border-bottom:1px dashed #e8ecf2;font-size:13px}.row:last-child{border-bottom:0}.row span{color:var(--muted)}.row b{text-align:right}.notice{padding:11px 13px;border-radius:12px;background:var(--amber-bg);color:#76520b;font-size:12px}.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{padding:7px 10px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:800}.badge.ok{background:var(--green-bg);color:var(--green);border-color:#c8ebdf}.badge.missing{background:var(--red-bg);color:var(--red);border-color:#f3c4cc}.plan{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.plan .p{border:1px solid var(--line);border-radius:12px;padding:11px;text-align:center}.plan label{display:block;color:var(--muted);font-size:11px}.plan b{display:block;font-size:17px;margin-top:4px}.muted{color:var(--muted);font-size:12px}.error{padding:24px;color:var(--red)}@media(max-width:1200px){.hero-main{grid-template-columns:1fr .6fr}.hero-block:nth-child(3){grid-column:1/-1;border-top:1px solid var(--line);border-right:0}.factors{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:820px){.shell{display:block;padding:10px}.sidebar{position:static;margin-bottom:12px}.stock-list{display:flex;overflow:auto}.stock-btn{min-width:210px}.hero-main{display:block}.hero-block{border-right:0;border-bottom:1px solid var(--line)}.quick,.grid,.plan{grid-template-columns:1fr 1fr}.funnel{min-height:120px}.factors{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.name{font-size:27px}.quick,.grid,.plan{grid-template-columns:1fr}.factors{grid-template-columns:1fr}.factor{border-right:0;border-bottom:1px solid var(--line)}}
</style></head><body><header class="topbar"><div class="brand">MLS · STOCK DECISION</div><div class="topbar-note" id="meta">讀取中…</div></header><div class="shell"><aside class="sidebar"><div class="sidebar-head"><h2>固定觀察池</h2><p id="pool-meta">載入 51 檔…</p></div><div class="stock-list" id="pool"></div></aside><main class="main" id="app"><div class="muted">個股資料載入中…</div></main></div>
<script>
const API=location.protocol==='file:'?'http://66.42.42.150:8000':'';const esc=s=>String(s??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const n=v=>v==null?'—':Number(v).toLocaleString('en-US');const pct=v=>v==null?'—':(Number(v)>0?'+':'')+Number(v).toFixed(2)+'%';
let pool=[],current='';
async function getPool(){const d=await (await fetch(API+'/api/intraday-watchpool',{cache:'no-store'})).json();pool=d.rows||[];document.getElementById('pool-meta').textContent=`${d.count||pool.length} 檔固定名單 · 資料 ${d.updated_at||'—'}`;renderPool();if(!current){const q=(location.search.match(/[?&]code=(\d{4})/)||[])[1];current=q||pool.find(x=>x.has_data)?.code||pool[0]?.code; }if(current)loadCard(current)}
function renderPool(){document.getElementById('pool').innerHTML=pool.map(x=>`<button class="stock-btn ${x.code===current?'active':''}" onclick="loadCard('${x.code}')"><div class="stock-btn-top"><div><div class="stock-code">${esc(x.code)}</div><div class="stock-name">${esc(x.name)}</div></div><div class="stock-score">${x.score==null?'—':x.score}</div></div><div class="stock-meta"><span>${esc(x.group||'觀察')}</span><span>${pct(x.change_rate)}</span><span>${esc(x.sector||'—')}</span></div></button>`).join('')}
async function loadCard(code){current=String(code).match(/\d{4}/)?.[0]||'';if(!current)return;renderPool();document.getElementById('app').innerHTML='<div class="muted">讀取 '+esc(current)+'…</div>';try{const [a,b]=await Promise.all([fetch(API+'/api/stock/'+current,{cache:'no-store'}).then(r=>r.json()),fetch(API+'/api/intraday-watchpool',{cache:'no-store'}).then(r=>r.json())]);const live=b.rows?.find(x=>String(x.code)===current)||{};if(!a.ok)throw Error(a.error||'個股 API 失敗');render(a,a.card||{},live)}catch(e){document.getElementById('app').innerHTML='<div class="error">個股資料載入失敗：'+esc(e.message)+'</div>'}}
function render(d,c,x){const chip=c.chip||{},tech=c.tech||{},flow=c.flow||{},trade=c.trade||{},f=x.score_factors||{};const group=x.group||c.grade||'待回報';const entry=group==='可操作',risk=group==='排除';const score=x.score??c.health_score;const factorRows=[['資金健康度','money_health'],['主動買賣差','net_active'],['承接品質','absorption'],['MA20','vs_ma20'],['法人連買','inst_streak'],['融資','margin']];const factors=factorRows.map(([label,key])=>{const z=f[key]||{},p=z.points==null?null:Number(z.points),m=z.max||0;return `<div class="factor"><div class="head">${label} ${p==null?'—':p+' / '+m}</div><div class="num">${p==null?'—':p}</div><div class="bar"><i style="width:${p==null?0:Math.min(100,p/m*100)}%"></i></div><p>${esc(z.status||'缺資料')}</p></div>`}).join('');const missing=x.score_missing||[];document.getElementById('meta').textContent=`${d.name||current} · ${d.updated_at||'—'}`;document.getElementById('app').innerHTML=`<section class="hero"><div class="hero-main"><div class="hero-block"><div class="identity"><span class="code">${esc(current)}</span><span class="name">${esc(d.name||current)}</span><span class="tag">${esc(d.sector||'—')}</span><span class="tag">${esc(x.subgroup||'盤中觀察')}</span></div><div class="stars">${entry?'★★★★★':risk?'★☆☆☆☆':'★★★☆☆'}</div><div class="quick"><div class="q"><label>今日</label><b class="${Number(x.change_rate)>=0?'pos':'neg'}">${pct(x.change_rate)}</b></div><div class="q"><label>現價</label><b>${esc(x.price??d.live?.price)}</b></div><div class="q"><label>aflow</label><b>${n(x.aflow)}</b></div><div class="q"><label>分類</label><b>${esc(group)}</b></div></div></div><div class="hero-block decision"><div class="score">${score==null?'—':score}<small>/100</small></div><h2>${entry?'可進場':risk?'風險':'觀察'}</h2><p>${esc(x.score_rule||'真實資料計分')}</p><span class="state">${esc(group)}</span></div><div class="hero-block"><div class="funnel"><div class="layer ${missing.length?'warn':'pass'}"><div class="k">L1 資料完整</div><div class="v">${missing.length?'待補':'通過'}</div><div class="d">${missing.length?'缺 '+missing.length+' 項':'全部已接入'}</div></div><div class="layer ${x.ma20?'pass':'warn'}"><div class="k">L2 MA20</div><div class="v">${x.ma20?'已接入':'無資料'}</div><div class="d">${x.ma20?'最近日K快取':'不補假數字'}</div></div><div class="layer ${entry?'pass':risk?'fail':'warn'}"><div class="k">L3 分類</div><div class="v">${esc(group)}</div><div class="d">${esc(x.classification_reason||'—')}</div></div></div></div></div><div class="factors">${factors}</div></section><section class="section"><div class="section-head"><div class="section-title">AI 最終結論</div><div class="source">真實資料 · ${esc(x.score_rule||'')}</div></div><div class="section-body"><div class="notice">${esc(x.classification_reason||c.ai?.summary||'目前尚無足夠資料生成結論。')}</div><div class="badges" style="margin-top:12px">${missing.map(v=>`<span class="badge missing">缺 ${esc(v)}</span>`).join('')||'<span class="badge ok">資料完整</span>'}</div></div></section><section class="section"><div class="section-head"><div class="section-title">技術面／資金面／族群面</div><div class="source">最近資料時間 ${esc(x.ma20_cache?.date||d.updated_at||'—')}</div></div><div class="section-body"><div class="grid"><div class="card"><h3>技術面</h3><div class="rows"><div class="row"><span>現價／漲跌</span><b>${esc(x.price)} / ${pct(x.change_rate)}</b></div><div class="row"><span>MA20</span><b>${esc(x.ma20)}</b></div><div class="row"><span>站上 MA20</span><b class="${x.ma20&&x.price>=x.ma20?'pos':'warn'}">${x.ma20?(x.price>=x.ma20?'✓ 站上':'✗ 跌破'):'—'}</b></div><div class="row"><span>成交量</span><b>${n(x.total_volume)}</b></div></div></div><div class="card"><h3>資金面</h3><div class="rows"><div class="row"><span>主動買賣差</span><b>${n(x.aflow)}</b></div><div class="row"><span>代理象限</span><b>${esc(x.quadrant)}</b></div><div class="row"><span>量比</span><b>${esc(x.volume_ratio)}</b></div><div class="row"><span>資料來源</span><b>Shioaji 即時</b></div></div></div><div class="card"><h3>分類依據</h3><div class="rows"><div class="row"><span>分數</span><b>${score==null?'—':score+' / 100'}</b></div><div class="row"><span>可計分上限</span><b>${x.score_available??'—'} / 100</b></div><div class="row"><span>缺資料</span><b>${missing.length||'無'}</b></div><div class="row"><span>分類</span><b>${esc(group)}</b></div></div></div></div></div></section><section class="section"><div class="section-head"><div class="section-title">籌碼與承接</div><div class="source">盤後法人快取</div></div><div class="section-body"><div class="grid"><div class="card"><h3>法人</h3><div class="rows"><div class="row"><span>最近資料日</span><b>${esc(chip.source_date)}</b></div><div class="row"><span>外資</span><b>${n(chip.foreign)}</b></div><div class="row"><span>投信</span><b>${n(chip.trust)}</b></div><div class="row"><span>自營</span><b>${n(chip.dealer)}</b></div></div></div><div class="card"><h3>近 20 日</h3><div class="rows"><div class="row"><span>法人淨</span><b>${n(chip.foreign_net_20d)}</b></div><div class="row"><span>外資連買</span><b>${n(chip.inst_streak)}</b></div><div class="row"><span>資料來源</span><b>${esc(chip.source||'—')}</b></div></div></div><div class="card"><h3>承接品質</h3><div class="rows"><div class="row"><span>狀態</span><b>${missing.includes('承接品質')?'缺資料':'已接入'}</b></div><div class="row"><span>融資</span><b>${missing.includes('融資')?'缺資料':'已接入'}</b></div><div class="row"><span>說明</span><b>不補假數字</b></div></div></div></div></div></section><section class="section"><div class="section-head"><div class="section-title">交易計畫</div><div class="source">僅在資料完整且達標時成立</div></div><div class="section-body"><div class="plan"><div class="p"><label>觸發價</label><b>${esc(trade.buy)}</b></div><div class="p"><label>停損</label><b class="neg">${esc(trade.stop)}</b></div><div class="p"><label>目標價</label><b class="pos">${esc(trade.t1||trade.t2)}</b></div><div class="p"><label>量能</label><b>${esc(trade.advice||'—')}</b></div><div class="p"><label>操作</label><b>${entry?'可進場':risk?'排除':'等待'}</b></div></div></div></section>`}
getPool();
</script><style>
/* 個股卡片是單檔詳情頁，觀察池留在主系統，不在此重複顯示 */
.shell{display:block;max-width:1720px}
.sidebar{display:none}
.main{width:100%}
</style></body></html>
