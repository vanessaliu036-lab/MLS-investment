<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA｜個股籌碼</title>
<style>
:root{--ink:#182033;--muted:#788292;--line:#e5e8eb;--paper:#fff;--bg:#f3f5f6;--navy:#11192d;--red:#d95a42;--red-soft:#fff0ec;--green:#149276;--green-soft:#eaf8f3;--gold:#9d7718;--gold-soft:#fff8df;--shadow:0 16px 40px rgba(24,32,51,.18)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif}body{overflow-x:hidden}.underlay{position:fixed;inset:0;overflow:hidden;background:#f7f8f8}.underlay-head{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:0 18px;color:#68717d;font-size:14px;font-weight:850}.underlay-head b{padding:10px 16px;border-radius:22px;background:#dcefe8;color:#167b62}.underlay-rows{padding-top:20px}.underlay-row{height:64px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:68px 1fr 84px 78px 84px;align-items:center;padding:0 18px;color:#7b848d}.underlay-row b{color:var(--ink);font-size:15px}.underlay-row strong{text-align:right;font-size:14px}.underlay-row .up{color:var(--red)}.underlay-row .down{color:var(--green)}.scrim{position:fixed;inset:0;background:rgba(13,20,30,.56)}.sheet{position:relative;z-index:2;width:min(550px,calc(100vw - 28px));height:min(940px,calc(100dvh - 28px));margin:14px auto;border-radius:22px;background:var(--paper);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}.handle{width:42px;height:5px;border-radius:4px;background:#d4dcd9;margin:10px auto 2px;flex:0 0 auto}.sheet-scroll{min-height:0;overflow:auto;padding:0 20px 0}.sheet-top{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:10px;padding:8px 0 0}.stock-title{display:flex;align-items:baseline;gap:8px;min-width:0}.stock-title strong{font-size:29px;letter-spacing:-.04em;white-space:nowrap}.counter{color:#66717b;font-size:12px;font-weight:850;white-space:nowrap}.date-picker{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line);border-radius:11px;color:#5f6874;font-size:14px;white-space:nowrap}.date-picker b{font-weight:850}.icon-button{width:42px;height:42px;border:0;background:transparent;color:#6b747d;font-size:25px;cursor:pointer}.icon-button:active,.action:active{transform:scale(.96)}.name-line{padding:3px 0 13px}.name-line h1{margin:0 0 8px;font-size:20px}.sector-tag{display:inline-block;padding:7px 12px;border:1px solid #cfdad5;border-radius:18px;background:#f4f8f6;color:#66756e;font-size:12px;font-weight:850}.chart{border-top:1px solid var(--line);padding:15px 0 10px}.chart-title{display:flex;align-items:center;gap:8px;color:#707a82;font-size:14px}.info{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid #7b8589;border-radius:50%;font-size:13px}.bars{height:78px;display:flex;align-items:flex-end;gap:4px;padding:10px 2px 0;border-bottom:1px dashed #cfd5d4}.bar{flex:1;min-width:3px;border-radius:2px 2px 0 0;background:var(--green);position:relative}.bar.up{background:var(--red)}.bar.down{background:var(--green)}.bar.mark::after{content:'▼';position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:9px;color:#5d6668}.legend{display:flex;gap:14px;padding-top:7px;color:#6e777d;font-size:11px}.legend i{display:inline-block;width:11px;height:9px;margin-right:4px;background:var(--red)}.legend i.down{background:var(--green)}.timeline{display:flex;justify-content:space-between;color:#6f777c;font-size:11px;padding-top:10px}.timeline b{display:block;color:#59636b;font-size:12px;margin-top:2px}.summary{border-top:1px solid var(--line)}.summary-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;min-height:53px;border-bottom:1px solid #edf0f0;font-size:16px}.summary-row .label{color:#59646b}.summary-row .value{text-align:right;font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}.summary-row .value.up{color:var(--red)}.summary-row .value.down{color:var(--green)}.summary-row .value.flat{color:#5d6771}.summary-row .subvalue{display:block;color:#667079;font-size:11px;font-weight:700}.badge{display:inline-flex;align-items:center;padding:3px 7px;border:1px solid currentColor;border-radius:6px;font-size:11px;font-weight:900;margin-left:6px}.badge.buy{color:var(--red);background:var(--red-soft)}.badge.sell{color:var(--green);background:var(--green-soft)}.flow-note{font-size:12px;color:#657078;margin-left:4px}.footer-actions{display:grid;grid-template-columns:1fr 1.35fr;gap:10px;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(255,255,255,.98);flex:0 0 auto}.action{min-height:52px;border-radius:13px;border:1px solid #cbd6d3;background:#eef4f1;color:#54615d;font:inherit;font-size:13px;font-weight:900;cursor:pointer}.action.watch{border:2px solid #5ab296;background:#f5fbf8;color:#167b62}.action.on{background:#dcefe8}.load-error{padding:40px 12px;text-align:center;color:var(--red)}@media(max-width:500px){.sheet{width:calc(100vw - 20px);height:calc(100dvh - 20px);margin:10px auto;border-radius:22px}.sheet-scroll{padding:0 20px}.sheet-top{grid-template-columns:minmax(0,1fr) auto auto auto;gap:4px}.stock-title strong{font-size:28px}.counter{font-size:11px}.date-picker{gap:5px;padding:8px 7px}.date-picker .date-arrow{display:none}.icon-button{width:34px}.underlay-row{grid-template-columns:52px 1fr 68px 64px 60px;padding:0 12px}.footer-actions{padding-left:20px;padding-right:20px}}
</style>
<style>
.breakdown-row{min-height:45px!important;font-size:14px!important;padding-left:24px}.breakdown-row .label{color:#6d767c}.breakdown-row .value{font-size:16px!important}.chip-date-note{margin-top:5px;color:#7a8389;font-size:11px;font-weight:750}.chart-loading{padding:30px 0!important;color:#737d83!important;font-size:12px!important}.source-details{margin-top:18px}.detail-heading{padding:14px 0 8px;border-top:1px solid var(--line);color:#6d767c;font-size:13px;font-weight:900}.source-details .summary-row .label{display:flex;flex-direction:column;align-items:flex-start;gap:2px}.source-inline{color:#9aa2a6;font-size:10px;font-weight:700}
</style>
</head>
<body>
<div class="underlay" aria-hidden="true"><div class="underlay-head"><b>我的清單</b><span>新清單</span><span>新清單 2</span><span>＋</span><span>⋯</span></div><div class="underlay-rows"><div class="underlay-row"><span>1815</span><b>富喬</b><strong>125.5</strong><strong class="up">+7.73%</strong><strong class="up">大買</strong></div><div class="underlay-row"><span>2049</span><b>上銀</b><strong>347.5</strong><strong class="down">−1.84%</strong><strong>—</strong></div><div class="underlay-row"><span>2303</span><b>聯電</b><strong>126</strong><strong class="down">−3.07%</strong><strong class="up">大買</strong></div><div class="underlay-row"><span>2327</span><b>國巨</b><strong>540</strong><strong class="down">−9.54%</strong><strong>大賣</strong></div></div></div>
<div class="scrim"></div>
<main class="sheet" role="dialog" aria-modal="true" aria-label="個股籌碼明細">
  <div class="handle"></div>
  <div class="sheet-scroll" id="sheet-scroll"><div id="loading">資料載入中…</div></div>
</main>
<script>
/* 彈窗先顯示籌碼快取；不要讓完整個股卡片的行情計算阻塞畫面。 */
(()=>{
  const nativeFetch=window.fetch.bind(window);
  window.fetch=(input,init)=>{
    const url=String(input),match=url.match(/\/api\/stock\/(\d{3,4})/);
    if(!match)return nativeFetch(input,init);
    const code=match[1],base=url.slice(0,url.indexOf('/api/stock/'));
    const chipUrl=`${base}/api/chips/${code}`,poolUrl=`${base}/api/watchpool`,historyUrl=`${base}/api/volume-history/${code}?days=30`;
    const chipTimeout=new Promise((_,reject)=>setTimeout(()=>reject(new Error('籌碼資料逾時，請檢查網路後重試')),10000));
    const chipPromise=Promise.race([nativeFetch(chipUrl,{cache:'no-store'}).then(r=>r.json()),chipTimeout]);
    const poolPromise=nativeFetch(poolUrl,{cache:'no-store'}).then(r=>r.json()).catch(()=>({items:[]}));
    const poolFast=Promise.race([poolPromise,new Promise(resolve=>setTimeout(()=>resolve({items:[]}),3000))]);
    return Promise.all([chipPromise,poolFast]).then(([chipPayload,pool])=>{
      const ch=chipPayload.chip||{},item=(pool.items||[]).find(x=>String(x.code)===code)||{};
      const chip={...ch,foreign:ch.foreign_net_d??ch.foreign,trust:ch.trust_net_d??ch.trust,dealer:ch.dealer_net_d??ch.dealer};window.__chipFast={chip,item};
      const chartAsOf=ch.source_date?`&asof=${encodeURIComponent(ch.source_date)}`:'';
      nativeFetch(`${historyUrl}${chartAsOf}`,{cache:'no-store'}).then(r=>r.json()).then(history=>{window.__volumeHistory=history;window.dispatchEvent(new CustomEvent('volume-history-ready'))}).catch(()=>{window.__volumeHistory={ok:false,items:[]};window.dispatchEvent(new CustomEvent('volume-history-ready'))});
      const fast={ok:!!chipPayload.ok,code,name:item.name||code,sector:item.sector||'其他',updated_at:pool.updated_at||'',card:{chip,price:item.price,change_rate:item.change_rate},post_market:{price:item.price,change_rate:item.change_rate,source_date:item.source_date,volume_history:[]}};
      return new Response(JSON.stringify(fast),{status:fast.ok?200:502,headers:{'Content-Type':'application/json'}});
    });
  };
})();
</script>
<script>
(()=>{
  const API=location.protocol==='file:'?'http://66.42.42.150:8000':'';const code=((location.search.match(/[?&]code=(\d{3,4})/)||[])[1])||'1815';const root=document.getElementById('sheet-scroll');
  const n=v=>v==null?'—':Number(v).toLocaleString('en-US');const rate=v=>v==null?'—':`${Number(v)>0?'+':''}${Number(v).toFixed(2)}%`;const tone=v=>Number(v)>0?'up':Number(v)<0?'down':'flat';const money=(v,price)=>v==null||price==null?'—':`${Number(v)>0?'+':''}${(Number(v)*1000*Number(price)/1e8).toFixed(2)} 億`;
  const sum=(...v)=>v.every(x=>x!=null)?v.reduce((a,b)=>a+Number(b),0):null;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const flow=v=>{const x=Number(v);return Number.isFinite(x)&&Math.abs(x)>=3000?{text:x>0?'異常大買':'異常大賣',cls:x>0?'buy':'sell'}:null};
  const renderBars=(history=[])=>{const xs=history.filter(x=>x&&x.volume!=null).slice(-30);if(!xs.length)return '<div class="load-error">成交量歷史暫無資料</div>';const max=Math.max(...xs.map(x=>Number(x.volume)||0),1);return `<div class="bars">${xs.map((x,i)=>{const prev=xs[i-1];const cls=prev&&Number(x.close)<Number(prev.close)?'down':'up';const mark=Number(x.volume)>max*.8?'mark':'';return `<span class="bar ${cls} ${mark}" style="height:${Math.max(8,Number(x.volume)/max*62)}px"></span>`}).join('')}</div>`};
  const render=async()=>{try{const d=await fetch(API+'/api/stock/'+code,{cache:'no-store'}).then(r=>r.json());if(!d.ok)throw Error(d.error||'個股 API 失敗');const c=d.card||{},p=d.post_market||{},ch=c.chip||{},price=c.price??p.price,prev=p.prev_close??c.prev_close,change=c.change_rate??p.change_rate;const daily=sum(ch.foreign,ch.trust,ch.dealer),five=sum(ch.foreign_net_5d,ch.trust_net_5d,ch.dealer_net_5d),twenty=ch.inst_net_20d_lots;const f=flow(daily);const streak=ch.inst_streak;root.innerHTML=`<div class="sheet-top"><div class="stock-title"><strong>${esc(code)}</strong><span class="counter">‹　25 / 27　›</span></div><div class="date-picker"><span class="date-arrow">‹</span><b>${esc((ch.source_date||'').slice(5).replace('-','/')||'—')}</b><span class="date-arrow">›</span></div><button class="icon-button" id="share" type="button" aria-label="分享">⌯</button><button class="icon-button" id="close" type="button" aria-label="關閉">×</button></div><div class="name-line"><h1>${esc(d.name||code)}</h1><span class="sector-tag">${esc(d.sector||'其他')}</span></div><section class="chart"><div class="chart-title">成交量（張） <span class="info">!</span></div>${renderBars(p.volume_history)}<div class="legend"><span><i></i>法人買</span><span><i class="down"></i>法人賣</span><span>▼ 爆量　— 20日均量</span></div><div class="timeline"><span>30日前<b>${esc((p.volume_history?.[0]?.date||'').slice(5).replace('-','/')||'—')}</b></span><span>20日前<b>08/03</b></span><span>10日前<b>08/17</b></span><span>現在<b>${esc((ch.source_date||p.source_date||'').slice(5).replace('-','/')||'—')}</b></span></div></section><section class="summary"><div class="summary-row"><span class="label">當日漲跌</span><strong class="value ${tone(change)}">${prev==null||price==null?'—':`${Number(prev).toFixed(2)} → ${Number(price).toFixed(2)}`} <span>${rate(change)}</span></strong></div><div class="summary-row"><span class="label">法人當日買賣超 <span class="badge ${f?.cls||''}">${f?.text||'—'}</span></span><strong class="value ${tone(daily)}">${money(daily,price)}</strong></div><div class="summary-row"><span class="label">近 5 日買賣超　›</span><strong class="value ${tone(five)}">${money(five,price)}</strong></div><div class="summary-row"><span class="label">近 20 日累計　›</span><strong class="value ${tone(twenty)}">${money(twenty,price)}</strong></div><div class="summary-row"><span class="label">法人20日均價　<span class="info">!</span></span><strong class="value">${ch.inst_avg_price_20d??'—'}<span class="subvalue">${ch.inst_avg_price_20d&&price?'現價高 '+(((price/ch.inst_avg_price_20d)-1)*100).toFixed(1)+'%':''}</span></strong></div><div class="summary-row"><span class="label">融資20日均價　<span class="info">!</span></span><strong class="value">${ch.margin_avg_price_20d??'—'}<span class="subvalue">${ch.margin_avg_price_20d&&price?'現價高 '+(((price/ch.margin_avg_price_20d)-1)*100).toFixed(1)+'%':''}</span></strong></div><div class="summary-row"><span class="label">外資停留　<span class="info">!</span></span><strong class="value ${streak>0?'up':streak<0?'down':'flat'}">${streak>0?'連續流入 '+streak+' 天':streak<0?'連續流出 '+Math.abs(streak)+' 天':'—'}<span class="subvalue">${streak>0?'↑ 流入加速':''}</span></strong></div><div class="summary-row"><span class="label">外資持股比率</span><strong class="value">${ch.foreign_share_pct==null?'—':Number(ch.foreign_share_pct).toFixed(2)+'%'}</strong></div></section>`;document.getElementById('close').onclick=()=>location.href='/chips';document.getElementById('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:`${d.name||code} 個股籌碼`,url:location.href});else await navigator.clipboard.writeText(location.href)}catch(_){}}}catch(e){root.innerHTML=`<div class="load-error">資料載入失敗：${esc(e.message)}<br><button class="action" onclick="location.reload()">重新載入</button></div>`}};
  render();
})();
</script>
<script>
(()=>{
  const money=(v,price)=>v==null||price==null?'—':`${Number(v)>0?'+':''}${(Number(v)*1000*Number(price)/1e8).toFixed(2)} 億`;
  const addBreakdown=()=>{
    const fast=window.__chipFast,summary=document.querySelector('.summary');if(!fast||!summary||summary.dataset.breakdown==='1')return;
    const ch=fast.chip||{},price=fast.item?.price, groups=[
      ['近 5 日買賣超',['foreign_net_5d','trust_net_5d','dealer_net_5d']],
      ['近 20 日累計',['foreign_net_20d','trust_net_20d','dealer_net_20d']]
    ];
    const rows=[...summary.querySelectorAll('.summary-row')];
    groups.forEach(([title,keys])=>{
      const total=rows.find(row=>row.querySelector('.label')?.textContent.includes(title));if(!total)return;
      const names=['外資','投信','自營'];keys.forEach((key,i)=>{const row=document.createElement('div');row.className='summary-row breakdown-row';row.innerHTML=`<span class="label">└ ${names[i]}</span><strong class="value ${Number(ch[key])>0?'up':Number(ch[key])<0?'down':'flat'}">${money(ch[key],price)}</strong>`;total.after(row);total= row});
    });
    const nameLine=document.querySelector('.name-line');if(nameLine&&!nameLine.querySelector('.chip-date-note')){const note=document.createElement('div');note.className='chip-date-note';note.textContent=`籌碼資料日：${ch.source_date||'—'}`;nameLine.appendChild(note)}
    summary.dataset.breakdown='1';
  };
  const renderOtherData=()=>{
    const fast=window.__chipFast,summary=document.querySelector('.summary');if(!fast||!summary||document.querySelector('.source-details'))return;
    const ch=fast.chip||{},lots=v=>v==null?'—':`${Number(v).toLocaleString('en-US')} 張`,pct=v=>v==null?'—':`${Number(v)>0?'+':''}${Number(v).toFixed(2)}%`,ratio=v=>v==null?'—':`${(Number(v)*100).toFixed(2)}%`,src=k=>ch[k]?`資料日 ${ch[k]}`:'資料日 —';
    const rows=[
      ['融資餘額變化',ch.margin_change_d,lots,'margin_source_date'],['融資餘額',ch.margin_balance,lots,'margin_source_date'],
      ['融券餘額變化',ch.short_change_d,lots,'margin_source_date'],['券資比',ch.short_margin_ratio,ratio,'margin_source_date'],
      ['借券成交量',ch.lending_volume_d,lots,'lending_source_date'],['借券賣出餘額',ch.lending_balance,lots,'lending_source_date'],
      ['借券賣出餘額變化',ch.lending_balance_change_d,lots,'lending_source_date'],['外資持股比率',ch.foreign_share_pct,pct,'foreign_share_source_date'],
      ['外資持股比增減',ch.foreign_share_change,pct,'foreign_share_source_date'],['距外資上限',ch.foreign_share_remain_pct,pct,'foreign_share_source_date']
    ];
    const section=document.createElement('section');section.className='summary source-details';section.innerHTML='<div class="detail-heading">其他籌碼資料</div>'+rows.map(([label,value,format,dateKey])=>`<div class="summary-row"><span class="label">${label}<small class="source-inline">${src(dateKey)}</small></span><strong class="value ${typeof value==='number'&&value>0?'up':typeof value==='number'&&value<0?'down':'flat'}">${format(value)}</strong></div>`).join('');summary.after(section);
  };
  const drawRealVolume=()=>{
    const payload=window.__volumeHistory,chart=document.querySelector('.chart');if(!payload||!chart)return;
    const xs=(payload.items||[]).filter(x=>x&&x.volume!=null&&x.date).slice(-30),empty=chart.querySelector('.load-error');
    if(!xs.length){if(empty){empty.className='chart-loading';empty.textContent='暫無真實日 K 成交量資料'};return}
    const max=Math.max(...xs.map(x=>Number(x.volume)||0),1),bars=xs.map((x,i)=>{const prev=xs[i-1],cls=prev&&Number(x.close)<Number(prev.close)?'down':'up';return `<span class="bar ${cls}" style="height:${Math.max(8,Number(x.volume)/max*62)}px"></span>`}).join('');
    if(empty)empty.outerHTML=`<div class="bars">${bars}</div>`;else{const old=chart.querySelector('.bars');if(old)old.outerHTML=`<div class="bars">${bars}</div>`}
    const timeline=chart.querySelectorAll('.timeline b');if(timeline.length){timeline[0].textContent=xs[0].date.slice(5).replace('-','/');timeline[timeline.length-1].textContent=xs[xs.length-1].date.slice(5).replace('-','/')}
  };
  addBreakdown();renderOtherData();drawRealVolume();new MutationObserver(()=>{addBreakdown();renderOtherData();drawRealVolume()}).observe(document.getElementById('sheet-scroll'),{childList:true,subtree:true});window.addEventListener('volume-history-ready',drawRealVolume);
})();
</script>
</body>
</html>
