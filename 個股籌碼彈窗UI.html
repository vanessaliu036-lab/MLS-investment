<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLS｜個股籌碼</title>
<style>
:root{--ink:#182033;--muted:#788292;--line:#e5e8eb;--paper:#fff;--bg:#f3f5f6;--navy:#11192d;--red:#d95a42;--red-soft:#fff0ec;--green:#149276;--green-soft:#eaf8f3;--gold:#9d7718;--gold-soft:#fff8df;--shadow:0 16px 40px rgba(24,32,51,.18)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif}body{overflow-x:hidden}.underlay{position:fixed;inset:0;overflow:hidden;background:#f7f8f8}.underlay-head{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:0 18px;color:#68717d;font-size:14px;font-weight:850}.underlay-head b{padding:10px 16px;border-radius:22px;background:#dcefe8;color:#167b62}.underlay-rows{padding-top:20px}.underlay-row{height:64px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:68px 1fr 84px 78px 84px;align-items:center;padding:0 18px;color:#7b848d}.underlay-row b{color:var(--ink);font-size:15px}.underlay-row strong{text-align:right;font-size:14px}.underlay-row .up{color:var(--red)}.underlay-row .down{color:var(--green)}.scrim{position:fixed;inset:0;background:rgba(13,20,30,.56)}.sheet{position:relative;z-index:2;width:min(550px,calc(100vw - 28px));height:min(940px,calc(100dvh - 28px));margin:14px auto;border-radius:22px;background:var(--paper);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}.handle{width:42px;height:5px;border-radius:4px;background:#d4dcd9;margin:10px auto 2px;flex:0 0 auto}.sheet-scroll{min-height:0;overflow:auto;padding:0 20px 0}.sheet-top{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:10px;padding:8px 0 0}.stock-title{display:flex;align-items:baseline;gap:8px;min-width:0}.stock-title strong{font-size:29px;letter-spacing:-.04em;white-space:nowrap}.counter{color:#66717b;font-size:12px;font-weight:850;white-space:nowrap}.date-picker{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line);border-radius:11px;color:#5f6874;font-size:14px;white-space:nowrap}.date-picker b{font-weight:850}.pro{padding:2px 7px;border:1px solid var(--gold);border-radius:7px;color:var(--gold);font-size:11px;font-weight:950}.icon-button{width:42px;height:42px;border:0;background:transparent;color:#6b747d;font-size:25px;cursor:pointer}.icon-button:active,.action:active{transform:scale(.96)}.name-line{padding:3px 0 13px}.name-line h1{margin:0 0 8px;font-size:20px}.sector-tag{display:inline-block;padding:7px 12px;border:1px solid #cfdad5;border-radius:18px;background:#f4f8f6;color:#66756e;font-size:12px;font-weight:850}.chart{border-top:1px solid var(--line);padding:15px 0 10px}.chart-title{display:flex;align-items:center;gap:8px;color:#707a82;font-size:14px}.info{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid #7b8589;border-radius:50%;font-size:13px}.bars{height:78px;display:flex;align-items:flex-end;gap:4px;padding:10px 2px 0;border-bottom:1px dashed #cfd5d4}.bar{flex:1;min-width:3px;border-radius:2px 2px 0 0;background:var(--green);position:relative}.bar.up{background:var(--red)}.bar.down{background:var(--green)}.bar.mark::after{content:'▼';position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:9px;color:#5d6668}.legend{display:flex;gap:14px;padding-top:7px;color:#6e777d;font-size:11px}.legend i{display:inline-block;width:11px;height:9px;margin-right:4px;background:var(--red)}.legend i.down{background:var(--green)}.timeline{display:flex;justify-content:space-between;color:#6f777c;font-size:11px;padding-top:10px}.timeline b{display:block;color:#59636b;font-size:12px;margin-top:2px}.summary{border-top:1px solid var(--line)}.summary-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;min-height:53px;border-bottom:1px solid #edf0f0;font-size:16px}.summary-row .label{color:#59646b}.summary-row .value{text-align:right;font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}.summary-row .value.up{color:var(--red)}.summary-row .value.down{color:var(--green)}.summary-row .value.flat{color:#5d6771}.summary-row .subvalue{display:block;color:#667079;font-size:11px;font-weight:700}.badge{display:inline-flex;align-items:center;padding:3px 7px;border:1px solid currentColor;border-radius:6px;font-size:11px;font-weight:900;margin-left:6px}.badge.buy{color:var(--red);background:var(--red-soft)}.badge.sell{color:var(--green);background:var(--green-soft)}.pro-row{color:#69736f}.pro-row .label{color:var(--gold)}.flow-note{font-size:12px;color:#657078;margin-left:4px}.footer-actions{display:grid;grid-template-columns:1fr 1.35fr;gap:10px;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(255,255,255,.98);flex:0 0 auto}.action{min-height:52px;border-radius:13px;border:1px solid #cbd6d3;background:#eef4f1;color:#54615d;font:inherit;font-size:13px;font-weight:900;cursor:pointer}.action.watch{border:2px solid #5ab296;background:#f5fbf8;color:#167b62}.action.on{background:#dcefe8}.load-error{padding:40px 12px;text-align:center;color:var(--red)}@media(max-width:500px){.sheet{width:calc(100vw - 20px);height:calc(100dvh - 20px);margin:10px auto;border-radius:22px}.sheet-scroll{padding:0 20px}.sheet-top{grid-template-columns:minmax(0,1fr) auto auto auto;gap:4px}.stock-title strong{font-size:28px}.counter{font-size:11px}.date-picker{gap:5px;padding:8px 7px}.date-picker .date-arrow{display:none}.icon-button{width:34px}.underlay-row{grid-template-columns:52px 1fr 68px 64px 60px;padding:0 12px}.footer-actions{padding-left:20px;padding-right:20px}}
</style>
<style data-mls-mobile-ui-final>
/* 2026-09-02：籌碼明細 sheet 內外使用同一手機安全邊界。 */
html,body{width:100%;max-width:100%;min-width:0;overflow-x:hidden}
.sheet,.sheet-scroll,.sheet-top,.stock-title,.name-line,.chart,.summary,.summary-row,.footer-actions{min-width:0;max-width:100%}
.sheet-scroll{overflow-x:hidden}
.stock-title,.date-picker,.summary-row{overflow-wrap:anywhere}
.summary-row .label{min-width:0}
.summary-row .value{min-width:0;overflow-wrap:anywhere}
@media(max-width:500px){
  .sheet-top{grid-template-columns:minmax(0,1fr) auto 34px 34px!important;gap:3px!important}
  .date-picker{font-size:12px}
  .summary-row{gap:7px;font-size:14px}
  .summary-row .value{font-size:16px}
  .footer-actions{padding-inline:14px}
}
</style>
<style data-mls-error-state>
.load-error{margin:24px 0;padding:24px 18px;border:1px solid #eadfbf;border-radius:16px;background:#fffaf0;color:#74510b;text-align:left;line-height:1.7}
.load-error strong{display:block;color:#182033;font-size:18px;margin-bottom:6px}
.load-error p{margin:0;color:#6f7a8e;font-size:13px}
.load-error .action{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:16px;padding:10px 16px;border:1px solid #172033;border-radius:10px;background:#172033;color:#fff;font:inherit;font-weight:850;text-decoration:none;cursor:pointer}
</style>
<style data-mls-chip-money-v2>
/* 2026-09-02：法人流量統一用資金（億元）閱讀。 */
.chip-money-note{margin:-2px 0 8px;color:#788292;font-size:11px}
</style>
<style data-mls-chip-detail-one-screen>
/* 2026-09-03：明細彈窗改成一屏讀完，不再靠下拉看完資訊。 */
.sheet{height:min(760px,calc(100dvh - 20px));margin:10px auto;border-radius:20px}
.handle{width:48px;height:5px;margin:8px auto 0}
.sheet-scroll{height:100%;overflow:auto;padding:0 18px 12px;display:flex;flex-direction:column;overscroll-behavior:contain}
.sheet-top{flex:0 0 auto;padding-top:6px;gap:8px}
.stock-title strong{font-size:26px}
.counter{font-size:11px}.date-picker{padding:6px 8px;font-size:13px;border-radius:9px}.pro{padding:1px 6px;font-size:10px}.icon-button{width:36px;height:36px;font-size:22px}
.name-line{flex:0 0 auto;padding:2px 0 8px}.name-line h1{margin-bottom:5px;font-size:18px}.sector-tag{padding:4px 9px;border-radius:10px;font-size:11px}
.chart{flex:0 0 auto;padding:10px 0 7px}.chart-title{font-size:12px}.info{width:18px;height:18px;font-size:11px}.bars{height:54px;gap:3px;padding-top:6px}.bar.mark::after{top:-11px;font-size:8px}
.legend{padding-top:5px;gap:10px;font-size:10px}.timeline{padding-top:6px;font-size:10px}.timeline b{font-size:10px}
.summary{flex:1 1 auto;min-height:0}.chip-money-note{margin:5px 0 3px;font-size:10px}.summary-row{min-height:34px;gap:8px;font-size:13px}.summary-row .value{font-size:14px}.summary-row .subvalue{font-size:10px}.badge{padding:2px 6px;font-size:10px}.source-date{display:inline-block;margin-left:6px;color:#8993a3;font-size:10px;font-weight:700;white-space:nowrap}.source-date-stale{color:#c0392b;background:#fdecea;border-radius:3px;padding:1px 4px}
@media(max-width:500px){
  .sheet{width:calc(100vw - 16px);height:calc(100dvh - 16px);margin:8px auto;border-radius:18px}
  .sheet-scroll{padding:0 14px 10px}
  .sheet-top{grid-template-columns:minmax(0,1fr) auto 30px 30px!important;gap:3px!important}
  .stock-title strong{font-size:23px}.counter{display:none}.date-picker{padding:5px 6px;font-size:11px}.pro{display:none}.icon-button{width:30px;height:30px;font-size:20px}
  .name-line{padding-bottom:6px}.name-line h1{font-size:17px}.sector-tag{padding:3px 8px}
  .chart{padding:8px 0 5px}.bars{height:42px}.legend{gap:8px;font-size:9px}.timeline{font-size:9px}.timeline b{font-size:9px}
  .chip-money-note{font-size:9px}.summary-row{min-height:31px;font-size:12px}.summary-row .value{font-size:13px}
}
@media(max-height:640px){
  .sheet{height:calc(100dvh - 10px);margin:5px auto}
  .handle{margin-top:5px}.sheet-scroll{padding-bottom:8px}.sheet-top{padding-top:4px}
  .stock-title strong{font-size:22px}.name-line h1{font-size:16px}.sector-tag{padding-block:2px}
  .chart{padding:5px 0 3px}.bars{height:30px}.legend,.timeline{display:none}
  .chip-money-note{display:none}.summary-row{min-height:28px;font-size:12px}.summary-row .value{font-size:13px}.summary-row .subvalue{display:none}
}
</style>
</head>
<body>
<div class="underlay" aria-hidden="true"><div class="underlay-head"><b>我的清單</b><span>新清單</span><span>新清單 2</span><span>＋</span><span>⋯</span></div><div class="underlay-rows"><div class="underlay-row"><span>1815</span><b>富喬</b><strong>125.5</strong><strong class="up">+7.73%</strong><strong class="up">大買</strong></div><div class="underlay-row"><span>2049</span><b>上銀</b><strong>347.5</strong><strong class="down">−1.84%</strong><strong>—</strong></div><div class="underlay-row"><span>2303</span><b>聯電</b><strong>126</strong><strong class="down">−3.07%</strong><strong class="up">大買</strong></div><div class="underlay-row"><span>2327</span><b>國巨</b><strong>540</strong><strong class="down">−9.54%</strong><strong>大賣</strong></div></div></div>
<div class="scrim"></div>
<main class="sheet" role="dialog" aria-modal="true" aria-label="個股籌碼明細">
  <div class="handle"></div>
  <div class="sheet-scroll" id="sheet-scroll"><div id="loading" role="status" aria-live="polite">資料載入中…</div></div>
</main>
<script>
(()=>{
  const API=location.protocol==='file:'?'http://66.42.42.150:8000':'';const code=((location.search.match(/[?&]code=(\d{3,4})/)||[])[1])||'1815';const root=document.getElementById('sheet-scroll');
  const n=v=>v==null?'—':Number(v).toLocaleString('en-US');const rate=v=>v==null?'—':`${Number(v)>0?'+':''}${Number(v).toFixed(2)}%`;const tone=v=>Number(v)>0?'up':Number(v)<0?'down':'flat';const lots=v=>v==null?'—':`${Number(v)>0?'+':''}${Number(v).toLocaleString('en-US')} 張`;const money=(lots,price)=>{const n=Number(lots),p=Number(price);if(!Number.isFinite(n)||!Number.isFinite(p)||p<=0)return '—';const value=n*p/100000;if(Math.abs(value)<0.005)return '0.00億';const digits=Math.abs(value)>=10?1:2;return `${value>0?'+':''}${value.toFixed(digits)}億`};
  const firstNum=(...v)=>v.find(x=>x!=null&&x!=='');
  const dateText=v=>{const s=String(v||'').slice(0,10);return s?`更新 ${s.slice(5).replace('-','/')}`:'更新日 —'};
  const dateMark=v=>`<span class="source-date">${esc(dateText(v))}</span>`;
  // 法人/融資/借券/外資持股各有自己的來源日，且常常互相落後——不能只顯示
  // 「更新 09/03」文字就當作已經誠實揭露；跟法人主日期(ch.source_date)差距
  // 太大時要用視覺警示標出來，不然使用者只會照單全收混在一起的日期。
  const daysBetween=(a,b)=>{const da=new Date(String(a||'').slice(0,10)),db=new Date(String(b||'').slice(0,10));if(isNaN(da)||isNaN(db))return null;return Math.round((db-da)/86400000)};
  const staleDateMark=(v,primary,staleAfter)=>{const s=String(v||'').slice(0,10);const d=s&&primary?daysBetween(s,primary):null;const stale=d!=null&&d>staleAfter;return `<span class="source-date${stale?' source-date-stale':''}">${esc(dateText(v))}${stale?` ⚠已過${d}天`:''}</span>`};
  const sum=(...v)=>v.every(x=>x!=null)?v.reduce((a,b)=>a+Number(b),0):null;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const flow=v=>{const x=Number(v);return Number.isFinite(x)&&Math.abs(x)>=3000?{text:x>0?'異常大買':'異常大賣',cls:x>0?'buy':'sell'}:null};
  const fetchJson=async url=>{const response=await fetch(url,{cache:'no-store'});let payload;try{payload=await response.json()}catch(_){throw Error('資料服務暫時無法回應')}if(!response.ok||payload?.ok===false)throw Error(payload?.error||'個股籌碼資料暫時無法載入');return payload};
  const renderBars=(history=[])=>{const xs=history.filter(x=>x&&x.volume!=null).slice(-30);if(!xs.length)return '<div class="load-error">成交量歷史暫無資料</div>';const max=Math.max(...xs.map(x=>Number(x.volume)||0),1);return `<div class="bars">${xs.map((x,i)=>{const prev=xs[i-1];const cls=prev&&Number(x.close)<Number(prev.close)?'down':'up';const mark=Number(x.volume)>max*.8?'mark':'';return `<span class="bar ${cls} ${mark}" style="height:${Math.max(8,Number(x.volume)/max*62)}px"></span>`}).join('')}</div>`};
  // 2026-09-03：改接 /api/chips + /api/watchpool?mode=chips + /api/volume-history 三支「只讀快取／本地K線」的快API，
  // 不再打 /api/stock/{code}（那支會組整張個股卡，連帶等 Shioaji／官方 TWSE 即時抓取——
  // TWSE 目前因請求量被 CDN 擋下，單一 stock 卡片因此卡在 15 秒逾時，籌碼彈窗被拖著一起變慢）。
  // 籌碼頁本來就該是「死資料」，不該等即時行情或外部官方 API。
  const render=async()=>{try{const [chipRes,wpRes,volRes]=await Promise.all([fetchJson(API+'/api/chips/'+code),fetchJson(API+'/api/watchpool?mode=chips').catch(()=>({items:[]})),fetchJson(API+'/api/volume-history/'+code+'?days=30').catch(()=>({items:[]}))]);if(!chipRes.ok)throw Error(chipRes.error||'籌碼 API 失敗');const ch=chipRes.chip||{},row=(wpRes.items||[]).find(x=>String(x.code)===String(code))||{},d={name:row.name,sector:row.sector},price=row.price,prev=null,change=row.change_rate,priceDate=row.price_source_date;const daily=firstNum(ch.inst_net_d_lots,sum(ch.foreign,ch.trust,ch.dealer)),five=firstNum(ch.inst_net_5d_lots,sum(ch.foreign_net_5d,ch.trust_net_5d,ch.dealer_net_5d)),twenty=ch.inst_net_20d_lots;const f=flow(daily);const streak=ch.inst_streak;
    // 量能圖走另一支純 Shioaji 端點，跟法人主日期(ch.source_date)不是同一來源；
    // 盤中還沒收盤的當日 K 混進來會讓「現在」那根量柱跟法人日期對不上，這裡裁到主日期為止。
    const vh=(volRes.items||[]).filter(x=>!ch.source_date||String(x.date||'').slice(0,10)<=String(ch.source_date).slice(0,10));const daysBack=n=>vh.length>n?esc((vh[vh.length-1-n]?.date||'').slice(5).replace('-','/')||'—'):'—';root.innerHTML=`<div class="sheet-top"><div class="stock-title"><strong>${esc(code)}</strong><span class="counter">‹　25 / 27　›</span></div><div class="date-picker"><span class="date-arrow">‹</span><b>${esc((ch.source_date||'').slice(5).replace('-','/')||'—')}</b><span class="date-arrow">›</span><em class="pro">Pro</em></div><button class="icon-button" id="share" type="button" aria-label="分享">⌯</button><button class="icon-button" id="close" type="button" aria-label="關閉">×</button></div><div class="name-line"><h1>${esc(d.name||code)}</h1><span class="sector-tag">${esc(d.sector||'其他')}</span></div><section class="chart"><div class="chart-title">成交量（張） <span class="info">!</span></div>${renderBars(vh)}<div class="legend"><span><i></i>法人買</span><span><i class="down"></i>法人賣</span><span>▼ 爆量　— 20日均量</span></div><div class="timeline"><span>30日前<b>${esc((vh[0]?.date||'').slice(5).replace('-','/')||'—')}</b></span><span>20日前<b>${daysBack(20)}</b></span><span>10日前<b>${daysBack(10)}</b></span><span>現在<b>${esc((ch.source_date||'').slice(5).replace('-','/')||'—')}</b></span></div></section><section class="summary"><div class="chip-money-note">各資料源獨立更新；日期依 API 最新回傳顯示。</div><div class="summary-row"><span class="label">當日漲跌${dateMark(priceDate)}</span><strong class="value ${tone(change)}">${prev==null||price==null?'—':`${Number(prev).toFixed(2)} → ${Number(price).toFixed(2)}`} <span>${rate(change)}</span></strong></div><div class="summary-row"><span class="label">三大法人當日資金（億）${dateMark(ch.source_date)} <span class="badge ${f?.cls||''}">${f?.text||'—'}</span></span><strong class="value ${tone(daily)}">${money(daily,price)}</strong></div><div class="summary-row"><span class="label">三大法人近 5 日資金（億）${dateMark(ch.source_date)}</span><strong class="value ${tone(five)}">${money(five,price)}</strong></div><div class="summary-row"><span class="label">三大法人近 20 日資金（億）${dateMark(ch.source_date)}</span><strong class="value ${tone(twenty)}">${money(twenty,price)}</strong></div><div class="summary-row"><span class="label">融資餘額${staleDateMark(ch.margin_source_date,ch.source_date,3)}</span><strong class="value ${tone(ch.margin_change_d)}">${ch.margin_balance==null?'—':n(ch.margin_balance)+' 張'}<span class="subvalue">${ch.margin_change_d==null?'':'日變化 '+lots(ch.margin_change_d)}</span></strong></div><div class="summary-row"><span class="label">借券餘額${staleDateMark(ch.lending_source_date,ch.source_date,3)}</span><strong class="value ${tone(ch.lending_balance_change_d)}">${ch.lending_balance==null?'—':n(ch.lending_balance)+' 張'}<span class="subvalue">${ch.lending_balance_change_d==null?'':'日變化 '+lots(ch.lending_balance_change_d)}</span></strong></div><div class="summary-row"><span class="label">外資停留${dateMark(ch.source_date)}</span><strong class="value ${streak>0?'up':streak<0?'down':'flat'}">${streak>0?'連續流入 '+streak+' 天':streak<0?'連續流出 '+Math.abs(streak)+' 天':'—'}<span class="subvalue">${streak>0?'↑ 流入加速':''}</span></strong></div><div class="summary-row"><span class="label">外資持股比率${staleDateMark(ch.foreign_share_source_date,ch.source_date,10)}</span><strong class="value">${ch.foreign_share_pct==null?'—':Number(ch.foreign_share_pct).toFixed(2)+'%'}</strong></div></section>`;document.getElementById('close').onclick=()=>location.href='/chips';document.getElementById('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:`${d.name||code} 個股籌碼`,url:location.href});else await navigator.clipboard.writeText(location.href)}catch(_){}}}catch(e){console.warn('chips detail load',e);root.innerHTML=`<div class="load-error"><strong>籌碼資料暫時無法載入</strong><p>目前沒有回傳完整的個股籌碼資料，請稍後再試，或先回到籌碼清單。</p><a class="action" href="/chips">回到籌碼清單</a></div>`}};
  render();
})();
</script>
</body>
</html>
