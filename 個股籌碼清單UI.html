<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA｜資金籌碼</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--line:#e2e7ed;--text:#172033;--muted:#748092;--navy:#11192d;--red:#d94b45;--red-soft:#fff0ef;--green:#11906d;--green-soft:#eaf8f3;--shadow:0 8px 24px rgba(28,43,68,.08)}
*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;line-height:1.45}.topbar{position:sticky;top:0;z-index:5;min-height:58px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 680px)/2));gap:12px}.brand{font-size:16px;font-weight:950;letter-spacing:.04em;white-space:nowrap}.topnote{font-size:11px;color:#c3cada;white-space:nowrap}.page{width:min(100%,680px);margin:0 auto;padding:12px 12px 84px}.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;min-height:44px;padding:10px 17px;border:0;border-radius:24px;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:850;cursor:pointer}.tab.active{background:#dcefe8;color:#167b62}.summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 4px 12px}.summary h1{margin:0;font-size:20px;letter-spacing:-.03em}.summary p{margin:0;color:var(--muted);font-size:12px;text-align:right}.list{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.row{display:grid;grid-template-columns:54px minmax(0,1fr) auto;grid-template-rows:auto auto;align-items:center;column-gap:10px;min-height:76px;width:100%;padding:10px 14px;border:0;border-bottom:1px solid #edf0f3;background:#fff;color:var(--text);text-align:left;font:inherit;cursor:pointer;transition:background .16s,transform .16s}.row:last-child{border-bottom:0}.row:active{background:#f3f7f8;transform:scale(.99)}.code{grid-column:1;grid-row:1 / span 2;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}.identity{grid-column:2;grid-row:1;display:flex;align-items:center;gap:7px;min-width:0}.name{font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sector{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quote{grid-column:3;grid-row:1;font-size:16px;font-weight:850;font-variant-numeric:tabular-nums;text-align:right}.change{grid-column:3;grid-row:2;font-size:13px;font-weight:900;font-variant-numeric:tabular-nums;text-align:right}.up{color:var(--red)}.down{color:var(--green)}.flat{color:var(--muted)}.flow-badge{display:inline-flex;align-items:center;width:max-content;padding:2px 7px;border:1px solid currentColor;border-radius:5px;font-size:10px;line-height:1.2;font-weight:950;letter-spacing:.03em}.flow-badge.buy{color:var(--red);background:var(--red-soft)}.flow-badge.sell{color:var(--green);background:var(--green-soft)}.subline{grid-column:2;grid-row:2;display:flex;align-items:center;gap:8px;min-width:0;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden}.subline .lots{font-variant-numeric:tabular-nums}.empty,.error{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px}.error{color:var(--red)}.retry{min-height:44px;margin-top:12px;padding:0 18px;border:1px solid currentColor;border-radius:22px;background:#fff;color:inherit;font:inherit;font-weight:850;cursor:pointer}.skeleton{height:76px;border-bottom:1px solid #edf0f3;background:linear-gradient(90deg,#fff 25%,#f1f4f7 50%,#fff 75%);background-size:200% 100%;animation:shimmer 1.1s infinite}@keyframes shimmer{to{background-position:-200% 0}}.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);height:68px;padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.97);border-top:1px solid var(--line)}.bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:850;text-decoration:none}.bottom-nav a.active{color:#167b62}.bottom-nav b{font-size:17px;line-height:1}@media(min-width:700px){.page{padding-top:22px}.bottom-nav{display:none}.row:hover{background:#f8fafc}}
</style>
<style>
/* 清單頁只保留四個快速判讀欄位；明細全部留在第二頁。 */
.row{grid-template-columns:48px minmax(0,1fr) auto;grid-template-rows:auto auto;min-height:128px;padding:12px 14px}.code{grid-column:1;grid-row:1;align-self:start;padding-top:3px}.identity{grid-column:2;grid-row:1;align-self:start}.quote{grid-column:3;grid-row:1;align-self:start}.metric-grid{grid-column:1 / -1;grid-row:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:10px;padding-top:9px;border-top:1px solid #edf0f3}.metric{min-width:0;display:flex;flex-direction:column;gap:2px}.metric span{color:var(--muted);font-size:10px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric strong{font-size:13px;font-weight:950;font-variant-numeric:tabular-nums;white-space:nowrap}.metric strong.up{color:var(--red)}.metric strong.down{color:var(--green)}.metric strong.flat{color:var(--muted)}.subline,.change{display:none}@media(max-width:460px){.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:8px}.metric span{font-size:11px}.metric strong{font-size:14px}.row{min-height:142px}}
</style>
<style>
.front-link{display:inline-flex;align-items:center;min-height:40px;margin-right:8px;padding:0 10px;border:1px solid rgba(255,255,255,.28);border-radius:10px;color:#fff;text-decoration:none;font-size:12px;font-weight:850}.front-link:active{transform:scale(.98)}
</style>
<style>
/* 51 檔列表：對齊手機示意圖的欄位式清單，不使用卡片堆疊。 */
.summary{display:none}.page{padding-top:8px}.tabs{padding:2px 0 8px;gap:4px}.tab{padding:9px 14px}.list{border-radius:0;border-left:0;border-right:0;box-shadow:none}.list-head{display:grid;grid-template-columns:58px minmax(0,1fr) 82px 72px 50px;align-items:center;gap:8px;padding:0 14px 8px;color:var(--muted);font-size:11px;font-weight:850}.list-head span:nth-child(n+3){text-align:right}.row{grid-template-columns:58px minmax(0,1fr) 82px 72px 50px;grid-template-rows:1fr;column-gap:8px;min-height:60px;padding:9px 14px;border-bottom:1px solid #edf0f3}.row .code{grid-column:1;grid-row:1;color:var(--muted);font-size:13px;align-self:center;padding:0}.row .identity{grid-column:2;grid-row:1;align-self:center;min-width:0}.row .name{font-size:15px}.row .quote{grid-column:3;grid-row:1;align-self:center;font-size:15px}.row .metric-grid{display:contents}.row .metric{min-width:0;display:flex;align-items:flex-end;justify-content:center;gap:0}.row .metric:nth-child(1){grid-column:4;grid-row:1}.row .metric:nth-child(2){grid-column:5;grid-row:1}.row .metric:nth-child(n+3){display:none}.row .metric span{font-size:0}.row .metric strong{font-size:13px}.row .metric strong.up{color:var(--red)}.row .metric strong.down{color:var(--green)}.row .flow-badge{font-size:10px;padding:2px 5px}.front-link{white-space:nowrap}@media(max-width:700px){.topbar{display:none}.page{padding:10px 0 78px}.tabs{padding:0 10px 9px}.tab{min-height:44px;padding:9px 13px;font-size:14px}.list-head{grid-template-columns:52px minmax(0,1fr) 72px 64px 45px;padding:0 14px 7px}.row{grid-template-columns:52px minmax(0,1fr) 72px 64px 45px;min-height:58px;padding:8px 14px}.row .name{font-size:15px}.row .quote{font-size:15px}.row .metric strong{font-size:12px}.bottom-nav{display:grid}}
</style>
<style>
/* iPhone 底部導覽：五個項目同列，避免第五個按鈕換行造成字重疊。 */
@media(max-width:700px){.page{padding-bottom:calc(98px + env(safe-area-inset-bottom))}.bottom-nav{grid-template-columns:repeat(5,minmax(0,1fr));height:72px;padding-bottom:env(safe-area-inset-bottom);background:#fff;box-shadow:0 -3px 12px rgba(28,43,68,.08)}.bottom-nav a{min-width:0;min-height:44px;padding:5px 2px;gap:3px;line-height:1.1;overflow:hidden}.bottom-nav b{display:block;height:18px;font-size:16px;line-height:18px}.bottom-nav span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}.row{overflow:hidden}.row .metric strong{max-width:100%;overflow:hidden;text-overflow:ellipsis}}
</style>
<style>
/* 籌碼模組不提供其他產品功能；列表頁不顯示底部跨模組導覽。 */
.bottom-nav{display:none!important}.page{padding-bottom:24px!important}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><a class="front-link" href="/">前台菜單</a><span>NEXORA · 資金籌碼</span></div><div class="topnote" id="updated">資料載入中</div></header>
<main class="page">
  <nav class="tabs" aria-label="清單選單"><button class="tab active" data-filter="all" type="button">我的清單</button><button class="tab" data-filter="all" type="button">新清單</button><button class="tab" data-filter="all" type="button">新清單 2</button><button class="tab" data-filter="all" type="button">＋</button><button class="tab" data-filter="all" type="button">⋯</button></nav>
  <section class="summary"><h1>資金籌碼快覽</h1><p id="summary-note">只看四項資金資訊<br>點選進入個股籌碼明細</p></section>
  <section class="list" id="list" aria-live="polite"><div class="list-head"><span>代碼</span><span>公司名</span><span>收盤價</span><span>漲幅</span><span>法人</span></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section>
</main>
<script>
(()=>{
  const API=location.protocol==='file:'?'http://66.42.42.150:8000':'';
  const list=document.getElementById('list'),updated=document.getElementById('updated'),note=document.getElementById('summary-note');let items=[],filter='all';
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const num=v=>v==null||v===''?'—':Number(v).toLocaleString('en-US');
  const lots=v=>v==null||v===''?'—':`${Number(v)>0?'+':''}${num(v)} 張`;
  const shortLots=v=>{if(v==null||v==='')return '—';const n=Number(v),a=Math.abs(n),s=n>0?'+':n<0?'−':'';return `${s}${a>=10000?(a/10000).toFixed(1)+'萬':a.toLocaleString('en-US')}`};
  const rate=v=>{const n=Number(v);return Number.isFinite(n)?`${n>0?'+':''}${n.toFixed(2)}%`:'—'};
  const tone=v=>Number(v)>0?'up':Number(v)<0?'down':'flat';
  const flow=v=>{const n=Number(v);if(!Number.isFinite(n)||Math.abs(n)<3000)return null;return n>0?{label:'大買',cls:'buy'}:{label:'大賣',cls:'sell'}};
  const listHead='<div class="list-head"><span>代碼</span><span>公司名</span><span>收盤價</span><span>漲幅</span><span>法人</span></div>';
  const filtered=()=>items.filter(x=>{const f=flow(x.inst_net_d_lots),c=Number(x.change_rate);return filter==='all'||(filter==='buy'&&f?.cls==='buy')||(filter==='sell'&&f?.cls==='sell')||(filter==='up'&&c>0)||(filter==='down'&&c<0)});
  const render=()=>{const rows=filtered();if(!rows.length){list.innerHTML=listHead+'<div class="empty">目前沒有符合條件的個股</div>';return}list.innerHTML=listHead+rows.map(x=>{const ch=tone(x.change_rate),daily=x.inst_net_d_lots,d5=x.inst_net_5d_lots,d20=x.inst_net_20d_lots,f=flow(daily);return `<button class="row" type="button" data-code="${esc(x.code)}"><span class="code">${esc(x.code)}</span><span class="identity"><b class="name">${esc(x.name||x.code)}</b>${f?`<em class="flow-badge ${f.cls}">${f.label}</em>`:''}</span><strong class="quote ${ch}">${x.price==null?'—':esc(x.price)}</strong><span class="metric-grid"><span class="metric"><span>當日漲跌</span><strong class="${ch}">${rate(x.change_rate)}</strong></span><span class="metric"><span>法人當日買賣超</span><strong class="${tone(daily)}">${shortLots(daily)}</strong></span><span class="metric"><span>近 5 日買賣超</span><strong class="${tone(d5)}">${shortLots(d5)}</strong></span><span class="metric"><span>近 20 日累計</span><strong class="${tone(d20)}">${shortLots(d20)}</strong></span></span></button>`}).join('')};
  const error=()=>{list.innerHTML='<div class="error">清單資料載入失敗<button class="retry" type="button" id="retry">重新載入</button></div>';document.getElementById('retry').onclick=load};
  async function load(){list.innerHTML=listHead+'<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';try{const r=await fetch(API+'/api/watchpool',{cache:'no-store'});if(!r.ok)throw Error('watchpool '+r.status);const d=await r.json();items=d.items||[];updated.textContent=d.updated_at?`更新 ${d.updated_at.replace('T',' ').slice(0,16)}`:'資料已更新';note.innerHTML=`只看四項資金資訊<br>點選進入個股籌碼明細 · ${items.length||51} 檔`;render()}catch(e){console.error(e);error()}}
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{filter=t.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));render()}));
  list.addEventListener('click',e=>{const row=e.target.closest('.row');if(row)location.href=`/chips/detail?code=${encodeURIComponent(row.dataset.code)}`});load();
})();
</script>
</body>
</html>
