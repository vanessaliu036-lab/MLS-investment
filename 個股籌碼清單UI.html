  .list-head span:nth-child(3),.row .quote,.list-head span:nth-child(6),.list-head span:nth-child(7),.row .metric:nth-child(3),.row .metric:nth-child(4){display:none!important}

}

<body>
<aside class="mls-nav" aria-label="主要選單"><span class="mls-nav-label">盤中決策</span><a class="mls-nav-link" href="/">決策首頁 <span id="homeStatusBadge" class="mls-nav-count">OFF</span></a><a class="mls-nav-link" href="/?view=radar">機會雷達 <span class="mls-nav-count">51</span></a><a class="mls-nav-link" href="/?view=watch">觀察池 51 檔 <span class="mls-nav-count">51</span></a><a class="mls-nav-link active" href="/chips" aria-current="page">籌碼 <span class="mls-nav-count">51</span></a><a class="mls-nav-link" href="/reversal-lab">資金反轉驗證 <span class="mls-nav-count live">LIVE</span></a><a class="mls-nav-link" href="/review">盤後驗證</a><a class="mls-nav-link" href="/opportunity-ledger">機會分層榜</a><a class="mls-nav-link" href="/line-b-ledger">買點監控</a><a class="mls-nav-link" href="/line-b-layers">七層交易狀態</a></aside>
<script>
// 「決策首頁」旁的 ON/OFF 徽章之前整頁都寫死 OFF，不管現在是不是盤中（2026-09-03 使用者回報）。
// 這裡跟首頁 marketClosed() 用同一組時間窗（09:00–13:30 台北時間、週一至五），只當顯示用途。
(function(){
  var badge=document.getElementById('homeStatusBadge');if(!badge)return;
  var f=function(n){return Number(new Intl.DateTimeFormat('en-US',Object.assign({hour12:false,timeZone:'Asia/Taipei'},{[n]:'2-digit'})).format(new Date()))};
  var minutes=f('hour')*60+f('minute');
  var weekday=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Taipei'})).getDay();
  var isWeekday=weekday>=1&&weekday<=5;
  badge.textContent=(isWeekday&&minutes>=540&&minutes<810)?'ON':'OFF';
})();
</script>
<main class="page">
  <section class="summary"><h1>資金籌碼</h1><p id="summary-note">法人買賣超、價格變化與 5D/20D 資金一頁掃描；點股票進明細。</p></section>
  <section class="chip-dashboard" aria-label="籌碼統計">
    <div class="chip-stat"><span>觀察檔數</span><strong id="stat-total">—</strong><em>固定 51 檔池</em></div>
    <div class="chip-stat"><span>法人買超</span><strong id="stat-buy" class="up">—</strong><em>當日法人資金為正</em></div>
    <div class="chip-stat"><span>法人賣超</span><strong id="stat-sell" class="down">—</strong><em>當日法人資金為負</em></div>
    <div class="chip-stat"><span>上漲／下跌</span><strong id="stat-market">—</strong><em>漲紅、跌綠</em></div>
  </section>
  <section class="chip-toolbar" aria-label="籌碼篩選">
    <div class="tabs">
      <button class="tab active" type="button" data-filter="all">全部</button>
      <button class="tab" type="button" data-filter="buy">法人買超</button>
      <button class="tab" type="button" data-filter="sell">法人賣超</button>
      <button class="tab" type="button" data-filter="up">上漲</button>
      <button class="tab" type="button" data-filter="down">下跌</button>
    </div>
    <div class="updated" id="updated">讀取中</div>
  </section>
  <section class="list" id="list" aria-live="polite"><div class="list-head"><span>代碼</span><span>公司名</span><span>收盤價</span><span>漲幅</span><span>D 法人</span><span>5D 法人</span><span>20D 法人</span></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section>
</main>
<script>
(()=>{
  const API=location.protocol==='file:'?'http://66.42.42.150:8000':'';
  const list=document.getElementById('list'),updated=document.getElementById('updated'),note=document.getElementById('summary-note');let items=window.__CHIP_WATCHPOOL__?.items||[],filter='all';
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const money=(lots,price)=>{const n=Number(lots),p=Number(price);if(!Number.isFinite(n)||!Number.isFinite(p)||p<=0)return '—';const value=n*p/100000;if(Math.abs(value)<0.005)return '0.00億';const digits=Math.abs(value)>=10?1:2;return `${value>0?'+':''}${value.toFixed(digits)}億`};
  const rate=v=>{const n=Number(v);return Number.isFinite(n)?`${n>0?'+':''}${n.toFixed(2)}%`:'—'};
  const tone=v=>Number(v)>0?'up':Number(v)<0?'down':'flat';
  const flow=v=>{const n=Number(v);if(!Number.isFinite(n)||Math.abs(n)<3000)return null;return n>0?{label:'大買',cls:'buy'}:{label:'大賣',cls:'sell'}};
  const signalClass=text=>/賣|空/.test(text)?'sell':/買|多/.test(text)?'buy':/異常|處置/.test(text)?'alert':'';
  const signals=x=>{const s=x.chip_signal||{},out=[];const add=text=>{if(text&&text!=='資料不足'&&!out.includes(text))out.push(text)};if(x.disposition===true||x.treatment===true||x.is_disposition===true)add('處置');else if(typeof x.disposition==='string'&&x.disposition.trim())add(`處置 ${x.disposition.trim()}`);const f=flow(x.inst_net_d_lots);if(f)add(f.label);(s.dynamics||[]).forEach(add);add(s.label);return out};
  const statTotal=document.getElementById('stat-total'),statBuy=document.getElementById('stat-buy'),statSell=document.getElementById('stat-sell'),statMarket=document.getElementById('stat-market');
  const listHead='<div class="list-head"><span>代碼</span><span>公司名</span><span>收盤價</span><span>漲幅</span><span>D 法人</span><span>5D 法人</span><span>20D 法人</span></div>';
  const filtered=()=>items.filter(x=>{const d=Number(x.inst_net_d_lots),c=Number(x.change_rate);return filter==='all'||(filter==='buy'&&d>0)||(filter==='sell'&&d<0)||(filter==='up'&&c>0)||(filter==='down'&&c<0)});
  const updateStats=()=>{const total=items.length,buy=items.filter(x=>Number(x.inst_net_d_lots)>0).length,sell=items.filter(x=>Number(x.inst_net_d_lots)<0).length,up=items.filter(x=>Number(x.change_rate)>0).length,down=items.filter(x=>Number(x.change_rate)<0).length;if(statTotal)statTotal.textContent=total||'—';if(statBuy)statBuy.textContent=buy||'0';if(statSell)statSell.textContent=sell||'0';if(statMarket)statMarket.innerHTML=`<span class="up">${up}</span><span class="flat"> / </span><span class="down">${down}</span>`};
  const render=()=>{updateStats();const rows=filtered();if(!rows.length){list.innerHTML=listHead+'<div class="empty">目前沒有符合條件的個股</div>';return}list.innerHTML=listHead+rows.map(x=>{const ch=tone(x.change_rate),daily=x.inst_net_d_lots,d5=x.inst_net_5d_lots,d20=x.inst_net_20d_lots,tags=signals(x);return `<button class="row" type="button" data-code="${esc(x.code)}"><span class="code">${esc(x.code)}</span><span class="identity"><b class="name">${esc(x.name||x.code)}</b><span class="signal-strip">${tags.map(tag=>`<em class="signal-tag ${signalClass(tag)}">${esc(tag)}</em>`).join('')}</span></span><strong class="quote ${ch}">${x.price==null?'—':esc(x.price)}</strong><span class="metric-grid"><span class="metric"><span>當日漲跌</span><strong class="${ch}">${rate(x.change_rate)}</strong></span><span class="metric"><span>法人當日資金</span><strong class="${tone(daily)}">${money(daily,x.price)}</strong></span><span class="metric"><span>近 5 日資金</span><strong class="${tone(d5)}">${money(d5,x.price)}</strong></span><span class="metric"><span>近 20 日資金</span><strong class="${tone(d20)}">${money(d20,x.price)}</strong></span></span></button>`}).join('')};
  const error=()=>{list.innerHTML='<div class="error">清單資料載入失敗<button class="retry" type="button" id="retry">重新載入</button></div>';document.getElementById('retry').onclick=load};
  async function load(){if(items.length){if(updated)updated.textContent='盤後法人快取';note.innerHTML=`顯示法人訊號<br>點選進入個股籌碼明細 · ${items.length} 檔`;render();return}list.innerHTML=listHead+'<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';try{const r=await fetch(API+'/api/watchpool?mode=chips',{cache:'no-store'});if(!r.ok)throw Error('watchpool '+r.status);const d=await r.json();items=d.items||[];if(updated)updated.textContent=d.updated_at?`更新 ${d.updated_at.replace('T',' ').slice(0,16)}`:'盤後法人快取';note.innerHTML=`顯示法人訊號<br>點選進入個股籌碼明細 · ${items.length||51} 檔`;render()}catch(e){console.error(e);error()}}
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{filter=t.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));render()}));
  list.addEventListener('click',e=>{const row=e.target.closest('.row');if(row)location.href=`/chips/detail?code=${encodeURIComponent(row.dataset.code)}`});load();
})();
</script>
</body>
