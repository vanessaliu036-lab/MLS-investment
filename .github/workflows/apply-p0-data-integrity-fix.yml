name: Apply MLS P0 data-integrity fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-p0-data-integrity-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - name: Apply fail-closed data-integrity patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base = Path('MLS整系統最終版v1.2')

          def sub(path, pattern, repl, flags=re.S):
              p = base / path
              s = p.read_text(encoding='utf-8')
              out, n = re.subn(pattern, repl, s, flags=flags)
              if n != 1:
                  raise SystemExit(f'{path}: expected 1 replacement, got {n}')
              p.write_text(out, encoding='utf-8')

          # 1) broker: snapshot requests must never synchronously fetch full-day ticks.
          sub('broker.py', r'def batch_snapshots\(codes\):.*?\n\ndef index_snapshot\(\):', '''def batch_snapshots(codes):
              """批次快照，只回傳行情與最佳委買/委賣掛單量。

              P0 data-integrity rule: Snapshot.buy_volume/sell_volume 是報價掛單量，
              不是主動買/賣成交量；不得覆寫成 A-flow，也不得在單檔 request path
              同步呼叫全日 ticks。可驗證的 A-flow 必須由獨立 canonical flow service
              注入 active_* 欄位；未注入時一律 None。
              """
              api = get_api()
              contracts = []
              for c in codes:
                  try:
                      contracts.append(api.Contracts.Stocks[c])
                  except Exception:
                      continue

              out = []
              for i in range(0, len(contracts), 400):
                  try:
                      snaps = api.snapshots(contracts[i:i + 400])
                  except Exception as e:
                      print(f"[broker] snapshots 批次失敗: {e}")
                      time.sleep(1)
                      continue
                  for s in snaps:
                      quote_buy = getattr(s, "buy_volume", 0) or 0
                      quote_sell = getattr(s, "sell_volume", 0) or 0
                      out.append({
                          "code": s.code,
                          "price": s.close,
                          "open": s.open, "high": s.high, "low": s.low,
                          "change_rate": s.change_rate,
                          "volume_ratio": getattr(s, "volume_ratio", 0) or 0,
                          "total_volume": (s.total_volume or 0),
                          "total_amount": (s.total_amount or 0),
                          "avg_price": getattr(s, "average_price", None),
                          "tick_type": getattr(s, "tick_type", None),
                          "bid_volume": quote_buy,
                          "ask_volume": quote_sell,
                          "buy_volume": None,
                          "sell_volume": None,
                          "active_buy_volume": None,
                          "active_sell_volume": None,
                          "active_flow_diff": None,
                          "active_flow_source": None,
                      })
                  time.sleep(0.3)
              return out


def index_snapshot():''')

          # 2) scoring: only verified active-trade sources may populate A-flow.
          sub('scoring.py', r'_prev_vol = \{\}.*?\n\ndef push_flow_ratio', '''VERIFIED_AFLOW_SOURCES = {"shioaji_ticks", "canonical_active_flow"}
          _aflow = {}           # code -> verified active buy - active sell
          _ratio_hist = {}      # code -> recent verified aflow_ratio


          def update_aflow(code, total_volume, tick_type=None,
                           buy_volume=None, sell_volume=None, source=None):
              """Update canonical A-flow only from an explicitly verified source.

              Missing data and quote-queue snapshots are *not* zero flow. They are
              unavailable and therefore cannot satisfy any entry/BS gate.
              """
              if source not in VERIFIED_AFLOW_SOURCES or buy_volume is None or sell_volume is None:
                  _aflow.pop(code, None)
                  return None
              try:
                  value = int(buy_volume or 0) - int(sell_volume or 0)
              except (TypeError, ValueError):
                  _aflow.pop(code, None)
                  return None
              _aflow[code] = value
              return value


          def push_flow_ratio''')
          sub('scoring.py', r'def reset_aflow\(\):.*?\n\ndef get_aflow\(code\):\n    return _aflow\.get\(code, 0\)', '''def reset_aflow():
              """每日開盤前清空已驗證 A-flow。"""
              _aflow.clear()
              _ratio_hist.clear()


          def get_aflow(code):
              return _aflow.get(code)''')
          sub('scoring.py', r'def bs_recent\(code, buy_vol, sell_vol\):.*?\n\ndef reset_bs', '''def bs_recent(code, buy_vol, sell_vol):
              """近端主動買賣比；資料未驗證/缺值時不可推估。"""
              if buy_vol is None or sell_vol is None:
                  _bs_prev.pop(code, None)
                  return None
              pb, ps = _bs_prev.get(code, (buy_vol, sell_vol))
              _bs_prev[code] = (buy_vol or 0, sell_vol or 0)
              db = max(0, (buy_vol or 0) - pb)
              ds = max(0, (sell_vol or 0) - ps)
              tot = db + ds
              if tot <= 0:
                  return None
              return round(db / tot * 100, 1)


          def reset_bs''')
          sub('scoring.py', r'    if not total_volume:\n        return None, ""\n    ratio = aflow / total_volume', '''    if aflow is None or not total_volume:
                  return None, ""
              ratio = aflow / total_volume''', flags=0)

          # 3) stock card: never interpret snapshot quote queues as active flow.
          p = base / 'stock_card.py'
          s = p.read_text(encoding='utf-8')
          s = s.replace('主動買/賣% = 快照 buy_volume/sell_volume(外/內盤累積);',
                        '主動買/賣% = 僅限已驗證 active_buy_volume/active_sell_volume;')
          old = '''    bv = (snap or {}).get("buy_volume") or 0
              sv = (snap or {}).get("sell_volume") or 0
              tot = bv + sv
              flow_block = {
                  "active_buy_pct": round(bv / tot * 100, 1) if tot else None,
                  "active_sell_pct": round(sv / tot * 100, 1) if tot else None,
                  "flow_5d": _flow_days(bars, 5),
                  "flow_10d": _flow_days(bars, 10),
              }'''
          new = '''    flow_source = (snap or {}).get("active_flow_source")
              verified_flow = flow_source in {"shioaji_ticks", "canonical_active_flow"}
              bv = (snap or {}).get("active_buy_volume") if verified_flow else None
              sv = (snap or {}).get("active_sell_volume") if verified_flow else None
              tot = ((bv or 0) + (sv or 0)) if bv is not None and sv is not None else 0
              flow_block = {
                  "active_buy_pct": round(bv / tot * 100, 1) if tot else None,
                  "active_sell_pct": round(sv / tot * 100, 1) if tot else None,
                  "flow_5d": _flow_days(bars, 5),
                  "flow_10d": _flow_days(bars, 10),
                  "source": flow_source if verified_flow else None,
              }'''
          if old not in s:
              raise SystemExit('stock_card.py: flow block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')

          # 4) engine: entry filters read only canonical active-trade fields.
          p = base / 'engine.py'
          s = p.read_text(encoding='utf-8')
          old = '''    aflow = scoring.update_aflow(s["code"], s.get("total_volume"),
                                       s.get("tick_type"),
                                       buy_volume=s.get("buy_volume"),
                                       sell_volume=s.get("sell_volume"))'''
          new = '''    aflow = scoring.update_aflow(
                  s["code"], s.get("total_volume"), s.get("tick_type"),
                  buy_volume=s.get("active_buy_volume"),
                  sell_volume=s.get("active_sell_volume"),
                  source=s.get("active_flow_source"))'''
          if old not in s:
              raise SystemExit('engine.py: aflow block not found')
          s = s.replace(old, new)
          old = '''    _bs_recent = scoring.bs_recent(s["code"], s.get("buy_volume"), s.get("sell_volume"))
              bs_pass, bs_detail = scoring.bs_filter(
                  s.get("buy_volume"), s.get("sell_volume"), market_pct,
                  intraday=True, recent_pct=_bs_recent)'''
          new = '''    active_buy = s.get("active_buy_volume")
              active_sell = s.get("active_sell_volume")
              verified_flow = s.get("active_flow_source") in scoring.VERIFIED_AFLOW_SOURCES
              if not verified_flow:
                  active_buy = active_sell = None
              _bs_recent = scoring.bs_recent(s["code"], active_buy, active_sell)
              bs_pass, bs_detail = scoring.bs_filter(
                  active_buy, active_sell, market_pct,
                  intraday=True, recent_pct=_bs_recent)'''
          if old not in s:
              raise SystemExit('engine.py: BS block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')

          # 5) money health: unavailable A-flow is not neutral/inflow; redistribute weight.
          sub('money_health.py', r'def _composite\(price_s, flow_s, chip_s, sector_s\):.*?\n\ndef stock_health', '''def _composite(price_s, flow_s, chip_s, sector_s):
              """缺資料模組直接移除，權重按比例重分配；絕不以 0 假裝有資料。"""
              parts = {"price": price_s, "sector": sector_s}
              if flow_s is not None:
                  parts["flow"] = flow_s
              if chip_s is not None:
                  parts["chip"] = chip_s
              w = {k: MODULE_WEIGHTS[k] for k in parts}
              wsum = sum(w.values())
              w = {k: v / wsum for k, v in w.items()}
              return int(round(sum(parts[k] * w[k] for k in parts)))


          def stock_health''')
          sub('money_health.py', r'def stock_health\(s, sector_pct=None, market_pct=0\.0,\n                 sector_rank=None, n_sectors=None\):.*?\n\ndef sector_health', '''def stock_health(s, sector_pct=None, market_pct=0.0,
                           sector_rank=None, n_sectors=None):
              aflow = scoring.get_aflow(s["code"])
              tv = s.get("total_volume") or 0
              ratio = (aflow / tv) if aflow is not None and tv > 0 else None
              if ratio is not None:
                  scoring.push_flow_ratio(s["code"], ratio)
                  velocity = scoring.flow_velocity(s["code"])
              else:
                  velocity = None
              chg = s.get("change_rate") or 0

              if ratio is None:
                  quad = "unverified"
                  label, stars, desc = "資料待驗證", "—", "A-flow 未取得已驗證來源，不參與方向判定"
              else:
                  flow_in = ratio >= 0
                  if flow_in and chg >= 0:   quad = "in_up"
                  elif flow_in and chg < 0:  quad = "in_down"
                  elif not flow_in and chg >= 0: quad = "out_up"
                  else: quad = "out_down"
                  label, stars, desc = HEALTH_LABEL[quad]

              chip, quality = chip_provider.get_chip_data(s["code"])
              price_s = _price_score(s)
              flow_s = _flow_score(ratio, velocity or 0) if ratio is not None else None
              chip_s = _chip_score(chip, quality)
              sector_s = _sector_score(chg, sector_pct, sector_rank, n_sectors)
              score = _composite(price_s, flow_s, chip_s, sector_s)

              return {"quadrant": quad, "label": label, "stars": stars, "desc": desc,
                      "health_score": score,
                      "aflow_ratio": round(ratio, 3) if ratio is not None else None,
                      "flow_velocity": velocity,
                      "module_scores": {"price": price_s, "flow": flow_s,
                                        "chip": chip_s, "sector": sector_s},
                      "chip_quality": quality}


          def sector_health''')
          sub('money_health.py', r'def sector_health\(sector_name, members\):.*?\n\n\n# ═+', '''def sector_health(sector_name, members):
              """族群資金健康度；沒有任何已驗證 A-flow 時不做資金方向分類。"""
              if not members:
                  return None
              scores = [m["_health"]["health_score"] for m in members if m.get("_health")]
              med = median(scores) if scores else 50
              flows = [scoring.get_aflow(m["code"]) for m in members]
              flows = [v for v in flows if v is not None]
              chg_med = median([m.get("change_rate") or 0 for m in members])
              if not flows:
                  return {"quadrant": "unverified", "label": "資料待驗證", "stars": "—",
                          "health_score": int(med), "advice": "A-flow 尚無已驗證來源"}
              net = sum(flows)
              flow_in = net >= 0
              if flow_in and chg_med >= 0: quad = "in_up"
              elif flow_in: quad = "in_down"
              elif chg_med >= 0: quad = "out_up"
              else: quad = "out_down"
              label, stars, desc = HEALTH_LABEL[quad]
              return {"quadrant": quad, "label": label, "stars": stars,
                      "health_score": int(med), "advice": desc}


          # ═''')
          p = base / 'money_health.py'
          s = p.read_text(encoding='utf-8')
          old = '''    r = health["aflow_ratio"]
              ev.append(("A", 1 if r > 0.05 else (-1 if r < -0.05 else 0),
                         f"主動淨流 {r:+.2f}"))'''
          new = '''    r = health.get("aflow_ratio")
              if r is None:
                  ev.append(("A", 0, "A-flow 尚未取得已驗證來源"))
              else:
                  ev.append(("A", 1 if r > 0.05 else (-1 if r < -0.05 else 0),
                             f"主動淨流 {r:+.2f}"))'''
          if old not in s:
              raise SystemExit('money_health.py: evidence block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')

          # 6) chip provider: reject impossible legacy percentage aliases before scoring.
          p = base / 'chip_provider.py'
          s = p.read_text(encoding='utf-8')
          anchor = 'RICH_FIELDS = ("holder_tiers", "broker_concentration",\n               "main_branch_net", "holder_concentration_delta")\n'
          insert = anchor + '''\n\ndef _sanitize_chip_data(data):
              d = dict(data or {})
              mismatch = False
              for key in ("big_holder_pct", "big400_pct", "big1000_pct"):
                  value = d.get(key)
                  if value is None:
                      continue
                  try:
                      value = float(value)
                  except (TypeError, ValueError):
                      d[key] = None; mismatch = True; continue
                  if not 0 <= value <= 100:
                      d[key] = None; mismatch = True
              if mismatch:
                  d["data_integrity_status"] = "DATA_MISMATCH"
              return d
          '''
          if anchor not in s:
              raise SystemExit('chip_provider.py: anchor not found')
          s = s.replace(anchor, insert, 1)
          s = s.replace('return data, ("premium" if has_rich else "finmind_basic")',
                        'return _sanitize_chip_data(data), ("premium" if has_rich else "finmind_basic")')
          s = s.replace('return (_chips.get_chips(code) or {}), "finmind_basic"',
                        'return _sanitize_chip_data(_chips.get_chips(code) or {}), "finmind_basic"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Run regression suite
        working-directory: MLS整系統最終版v1.2
        run: |
          pytest -q \
            test_broker_active_flow.py \
            test_p0_data_integrity.py \
            test_chips_official_priority.py \
            test_official_source_latest.py
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'MLS整系統最終版v1.2'
          git commit -m 'fix: fail closed on unverified MLS flow data'
          git push origin HEAD:main
