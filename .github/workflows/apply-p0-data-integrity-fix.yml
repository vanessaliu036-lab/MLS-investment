name: Apply MLS P0 data-integrity fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-p0-data-integrity-fix.yml'
      - '.github/scripts/apply_p0_fix.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - name: Apply patch
        run: python .github/scripts/apply_p0_fix.py
      - name: Run P0 regression suite
        working-directory: MLS整系統最終版v1.2
        run: |
          pytest -q \
            test_broker_active_flow.py \
            test_p0_data_integrity.py \
            test_chips_official_priority.py \
            test_official_source_latest.py
      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'MLS整系統最終版v1.2'
          git commit -m 'fix: fail closed on unverified MLS flow data'
          git push origin HEAD:main
