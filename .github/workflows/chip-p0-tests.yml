name: MLS P0 chip integrity
on:
  push:
    branches:
      - feat/screen-logic-canonical
    paths:
      - '個股卡片相關檔案_20260722/**'
      - '個股籌碼彈窗UI.html'
      - 'tests/test_chip_p0_canonical.py'
      - '.github/workflows/chip-p0-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - name: Run chip P0 regression tests
        run: pytest -q tests/test_chip_p0_canonical.py tests/test_chips_asof.py
