name: MLS production diagnostics
on:
  push:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe MLS production
        shell: bash
        run: |
          set -u
          BASES=("http://66.42.42.150:8000" "http://66.42.42.150")
          for base in "${BASES[@]}"; do
            echo "===== BASE $base ====="
            for path in / /api/health /health /api/tss/health /api/state /openapi.json; do
              echo "--- GET $base$path ---"
              code=$(curl -L -sS --connect-timeout 8 --max-time 15 -o /tmp/body -w '%{http_code}' "$base$path" || true)
              echo "HTTP=$code bytes=$(wc -c </tmp/body 2>/dev/null || echo 0)"
              head -c 2500 /tmp/body 2>/dev/null || true
              echo
            done
          done

      - name: Enumerate OpenAPI paths on port 8000
        shell: bash
        run: |
          curl -sS --connect-timeout 8 --max-time 15 http://66.42.42.150:8000/openapi.json -o /tmp/openapi.json || true
          if jq -e .paths /tmp/openapi.json >/dev/null 2>&1; then
            echo '=== OPENAPI PATHS ==='
            jq -r '.paths | keys[]' /tmp/openapi.json
          else
            echo 'No valid OpenAPI payload'
          fi

      - name: Inspect production root for chip-card labels and API calls
        shell: bash
        run: |
          curl -sS --connect-timeout 8 --max-time 15 http://66.42.42.150:8000/ -o /tmp/root.html || true
          echo '=== LABEL MATCHES ==='
          grep -nE '成交量歷史|法人當日買賣超|外資停留|外資持股比率|近.?20.?日|融資.?20.?日|fetch\(|/api/' /tmp/root.html | head -200 || true
