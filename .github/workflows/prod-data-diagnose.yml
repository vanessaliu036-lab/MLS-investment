name: MLS production data diagnostics
on:
  push:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe production mapping sources
        shell: bash
        run: |
          set -u
          BASE="http://66.42.42.150:8000"
          curl -sS --connect-timeout 6 --max-time 10 "$BASE/healthz" || true
          echo
          for path in /api/intraday-watchpool /api/intraday-test /ab/watchlist; do
            echo "===== $path selected rows ====="
            curl -sS --connect-timeout 6 --max-time 30 "$BASE$path" -o /tmp/payload || true
            jq -c '.. | objects | select(.code? == "2303" or .code? == "2344" or .code? == "6173" or .code? == "1815" or .code? == "8358" or .code? == "2408" or .code? == "3264" or .code? == "3016")' /tmp/payload 2>/dev/null | head -80 || true
          done
          echo "===== card JS context ====="
          curl -sS --connect-timeout 6 --max-time 20 "$BASE/api/card_page?code=2344" -o /tmp/card.html || true
          sed -n '510,630p' /tmp/card.html
          echo "===== root JS context 800-850 ====="
          curl -sS --connect-timeout 6 --max-time 20 "$BASE/" -o /tmp/root.html || true
          sed -n '800,850p' /tmp/root.html
          echo "===== root JS context 2060-2140 ====="
          sed -n '2060,2140p' /tmp/root.html
