<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MLS v4.1 Preview</title><style>:root{--bg:#faf8f3;--card:#fff;--ink:#17191d;--sub:#756d61;--line:#e7e0d3;--gold:#8a6d1a;--blue:#2563c7;--orange:#d97706;--red:#c83737;--green:#16845b;--violet:#6d5ce7;--soft:#f1ecdf;--shadow:0 7px 24px rgba(40,34,24,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;max-width:760px;margin:auto;padding-bottom:50px}.top{position:sticky;top:0;z-index:5;background:rgba(250,248,243,.96);backdrop-filter:blur(12px);padding:14px 16px;border-bottom:1px solid var(--line)}.title{font-size:18px;font-weight:800}.sub{font-size:11px;color:var(--sub);margin-top:3px}.banner{margin-top:10px;background:#fff4d9;color:#885c00;border:1px solid #ead69e;border-radius:10px;padding:8px 10px;font-size:11px;line-height:1.5}.tabs{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-top:12px;gap:3px}.tab{flex:1;border:0;background:transparent;padding:9px 5px;border-radius:9px;font-weight:750;color:var(--sub);font-size:12px}.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}.summary{padding:12px 16px 2px;font-size:12px;color:var(--sub);line-height:1.6}.list{padding:8px 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}.r1{display:flex;align-items:flex-start;gap:10px}.rank{width:28px;height:28px;border-radius:9px;background:#eee8d9;display:grid;place-items:center;font-weight:800;color:var(--gold)}.identity{flex:1}.name{font-size:17px;font-weight:800}.code{font-size:11px;color:var(--sub);margin-top:2px}.flow{text-align:right}.amt{font-size:18px;font-weight:850;font-variant-numeric:tabular-nums}.in{color:var(--blue)}.out{color:var(--orange)}.rev{color:var(--violet)}.chg{font-size:12px;margin-top:2px;font-weight:700}.up{color:var(--red)}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 9px}.pill{font-size:11px;font-weight:750;border-radius:100px;padding:5px 9px;background:#f4f2ec;color:var(--sub)}.good{background:#e8f3ec!important;color:var(--green)!important}.bad{background:#fff0ed!important;color:#b84f36!important}.info{background:#edf3ff!important;color:var(--blue)!important}.decision{border-top:1px solid var(--line);padding-top:10px}.state{font-size:12px;color:var(--gold);font-weight:800}.action{font-size:16px;font-weight:850;margin-top:2px}.text{font-size:13px;color:#514b42;line-height:1.65;margin-top:6px}.note{margin-top:10px;padding:10px 11px;border-radius:10px;background:#f6f3ff;color:#4b4383;font-size:11.5px;line-height:1.65}@media(max-width:520px){.card{padding:13px}.amt{font-size:16px}.tab{font-size:11px;padding:9px 2px}}</style></head><body><div class="top"><div class="title">MLS v4.1 · Flow × Chips Preview</div><div class="sub">獨立分支 UI 測試頁｜不接 VPS、不接正式 DB、不產生 ACTION</div><div class="banner">DEMO PREVIEW：部分欄位為版面測試用資料。6182／8150／3532／3374／2303 的已知觀察值依目前研究紀錄呈現；缺少的歷史欄位不補造。</div><div class="tabs"><button class="tab on" data-mode="inflow">資金流入 TOP10</button><button class="tab" data-mode="outflow">資金流出 TOP10</button><button class="tab" data-mode="reversal">反轉 DAY-1</button></div></div><div class="summary" id="summary"></div><div class="list" id="list"></div><script>const data={inflow:[{name:"全新",code:"2455",flow:"4,730萬",chg:"+4.20%",chip:"GOOD",state:"FLOW + CHIP RESONANCE",action:"可考慮進場",text:"資金與籌碼同步，等待回測／VWAP確認。",rate:"70.0% · n=30"},{name:"華邦電",code:"2344",flow:"3,850萬",chg:"+1.60%",chip:"GOOD",state:"INFLOW_STRONG",action:"等待確認",text:"資金流入明顯，但價格擴張尚未足夠。",rate:"70.0% · n=30"},{name:"欣興",code:"3037",flow:"3,120萬",chg:"+2.10%",chip:"WEAK",state:"FLOW AHEAD OF CHIPS",action:"不追價",text:"資金先行但籌碼未跟上，歷史優勢不足。",rate:"44.0% · n=30"}],outflow:[{name:"精材",code:"3374",flow:"-3,600萬",chg:"-1.00%",chip:"GOOD",state:"FALSE_FAIL_RESCUE_HIGH",action:"只觀察",text:"籌碼仍強、價格接受度高；Rescue 尚未通過樣本外驗證。",rate:"68.0% · n=30"},{name:"聯茂",code:"6213",flow:"-2,240萬",chg:"-2.40%",chip:"WEAK",state:"TRUE_FAIL",action:"排除",text:"資金流出且籌碼結構偏弱。",rate:"25.0% · n=30"},{name:"強茂",code:"2481",flow:"-1,870萬",chg:"-1.80%",chip:"GOOD",state:"FLOW_PRICE_DIVERGENCE",action:"排除",text:"Flow 看似強，但價格拒絕承接，屬反向警示。",rate:"30.0% · n=30"}],reversal:[{name:"合晶",code:"6182",aflow:"+8,872",chg:"+6.63%",state:"REVERSAL_DAY1_EARLY · A+ RESULT",r:[1,1,1,0,1],text:"前期極端流出後，10:59 已出現 A-flow 強翻正與價格擴張；11:45 116 元漲停 +9.95%。",note:"R4 Persistence 缺第二個較晚 A-flow 採樣，因此不偽造為已確認。結果成功，但規則只記 EARLY。"},{name:"南茂",code:"8150",aflow:"+15,779",chg:"約 +6%",state:"REVERSAL_PRIORITY · A",r:[1,1,1,1,1],text:"A-flow 10:59 +13,107 → 11:41 +15,779；價格 93.9 → 94.6，同方向持續增強。",note:"最標準 Persistence 樣本。"},{name:"台勝科",code:"3532",aflow:"+1,061",chg:"約 +6.7%",state:"REVERSAL_PRIORITY · B+",r:[1,1,1,1,1],text:"A-flow +604 → +1,061；價格 400.5 → 405。方向成立，但 Flow 強度低於南茂。",note:"用來比較『翻正強度』與 T+1/T+2 延續。"},{name:"精材",code:"3374",aflow:"-1,322",chg:"約 +5%",state:"OUTFLOW_REVERSAL_WATCH · CONTROL",r:[1,1,0,0,0],text:"價格強，但 A-flow 仍為負，不屬於今天的 Day-1 資金反轉型。",note:"非反轉流對照樣本。"},{name:"聯電",code:"2303",aflow:"+17,963",chg:"Trigger 129 hit",state:"NOT_REVERSAL · CONTROL",r:[0,0,1,0,0],text:"A-flow 很強、RVOL 1.65x，且價格 Trigger 129 已碰到；但 Acceptance = NO / FAILED，最終撤退／不進。",note:"8/31 官方：外資 -12,716 張、投信 +6,340 張、三大法人 -7,502 張。5D/20D 完整前期流出資料目前不足，因此不把它硬算成 REVERSAL DAY-1。"}]};let mode='inflow';const list=document.getElementById('list'),summary=document.getElementById('summary');function p(label,ok){return `<span class="pill ${ok?'good':'bad'}">${label} ${ok?'✓':'×'}</span>`}function flowCard(x,i){return `<div class="card"><div class="r1"><div class="rank">${i+1}</div><div class="identity"><div class="name">${x.name}</div><div class="code">${x.code}</div></div><div class="flow"><div class="amt ${mode==='inflow'?'in':'out'}">${x.flow}</div><div class="chg up">${x.chg}</div></div></div><div class="chips"><span class="pill info">金額門檻 通過</span><span class="pill ${x.chip==='GOOD'?'good':'bad'}">籌碼 ${x.chip}</span><span class="pill">DEMO</span></div><div class="decision"><div class="state">${x.state}</div><div class="action">${x.action}</div><div class="text">${x.text}</div><div class="note">歷史相似情境：${x.rate}</div></div></div>`}function reversalCard(x,i){return `<div class="card"><div class="r1"><div class="rank">${i+1}</div><div class="identity"><div class="name">${x.name}</div><div class="code">${x.code}</div></div><div class="flow"><div class="amt rev">A-flow ${x.aflow}</div><div class="chg up">${x.chg}</div></div></div><div class="chips">${p('R1 前期流出',x.r[0])}${p('R2 價格反轉',x.r[1])}${p('R3 A-flow Flip',x.r[2])}${p('R4 Persistence',x.r[3])}${p('R5 Price Confirm',x.r[4])}</div><div class="decision"><div class="state">${x.state}</div><div class="action">只觀察｜Research Layer</div><div class="text">${x.text}</div><div class="note">${x.note}</div></div></div>`}function render(){const rows=data[mode]||[];summary.innerHTML=mode==='reversal'?'Research Layer：比較「前期流出 → Day-1 A-flow Flip → Persistence → Price Confirmation」。所有狀態目前都不直接產生正式 ACTION。':(mode==='inflow'?'盤中資金流入 + 近期籌碼 + 歷史相似情境結論':'盤中資金流出 + 籌碼承接／錯殺救援判斷');list.innerHTML=rows.map((x,i)=>mode==='reversal'?reversalCard(x,i):flowCard(x,i)).join('')}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.mode;render()});render();</script></body></html>
