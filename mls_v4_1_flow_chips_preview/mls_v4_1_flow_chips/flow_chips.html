<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MLS v4.1 · Flow × Chips</title>
<style>
:root{--bg:#faf8f3;--card:#fff;--ink:#17191d;--sub:#756d61;--line:#e7e0d3;--gold:#8a6d1a;--blue:#2563c7;--orange:#d97706;--red:#c83737;--green:#16845b;--violet:#6d5ce7;--soft:#f1ecdf;--shadow:0 7px 24px rgba(40,34,24,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;max-width:760px;margin:auto;padding-bottom:50px}.top{position:sticky;top:0;z-index:5;background:rgba(250,248,243,.94);backdrop-filter:blur(12px);padding:14px 16px;border-bottom:1px solid var(--line)}.title{font-size:18px;font-weight:800}.sub{font-size:11px;color:var(--sub);margin-top:3px}.tabs{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-top:12px;gap:3px}.tab{flex:1;border:0;background:transparent;padding:9px 5px;border-radius:9px;font-weight:750;color:var(--sub);font-size:12px}.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}.summary{padding:12px 16px 2px;font-size:12px;color:var(--sub);line-height:1.6}.list{padding:8px 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}.r1{display:flex;align-items:flex-start;gap:10px}.rank{width:28px;height:28px;border-radius:9px;background:#eee8d9;display:grid;place-items:center;font-weight:800;color:var(--gold)}.identity{flex:1}.name{font-size:17px;font-weight:800}.code{font-size:11px;color:var(--sub);margin-top:2px}.flow{text-align:right}.amt{font-size:18px;font-weight:850;font-variant-numeric:tabular-nums}.in{color:var(--blue)}.out{color:var(--orange)}.rev{color:var(--violet)}.chg{font-size:12px;margin-top:2px;font-weight:700}.up{color:var(--red)}.down{color:var(--green)}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 9px}.pill{font-size:11px;font-weight:750;border-radius:100px;padding:5px 9px;background:#f4f2ec;color:var(--sub)}.pill.good{background:#e8f3ec;color:var(--green)}.pill.bad{background:#fff0ed;color:#b84f36}.pill.info{background:#edf3ff;color:var(--blue)}.pill.rev{background:#f0edff;color:var(--violet)}.decision{border-top:1px solid var(--line);padding-top:10px}.state{font-size:12px;color:var(--gold);font-weight:800}.action{font-size:16px;font-weight:850;margin-top:2px}.text{font-size:13px;color:#514b42;line-height:1.65;margin-top:6px}.history{margin-top:10px;padding:9px 11px;border-radius:10px;background:#faf7ef;font-size:12px;display:flex;justify-content:space-between;gap:10px}.history b{font-size:15px}.details{margin-top:10px;font-size:11px;color:var(--sub);line-height:1.65}.note{margin-top:10px;padding:10px 11px;border-radius:10px;background:#f6f3ff;color:#4b4383;font-size:11.5px;line-height:1.65}.empty{padding:45px 20px;text-align:center;color:var(--sub);line-height:1.8}.warn{color:#b45309;font-weight:700}.stale{border-color:#d99555;background:#fffaf3}.rpass{background:#e8f3ec;color:var(--green)}.rfail{background:#fff0ed;color:#b84f36}@media(max-width:520px){.card{padding:13px}.amt{font-size:16px}.tab{font-size:11px;padding:9px 2px}}
</style>
</head>
<body>
<div class="top"><div class="title">MLS v4.1 · Flow × Chips</div><div class="sub">獨立預覽｜只讀 DB 分析，不連主系統 ACTION</div><div class="tabs"><button class="tab on" data-mode="inflow">資金流入 TOP10</button><button class="tab" data-mode="outflow">資金流出 TOP10</button><button class="tab" data-mode="reversal">反轉 DAY-1</button></div></div>
<div class="summary" id="summary">讀取中…</div><div class="list" id="list"></div>
<script>
let MODE='inflow';
const fmtAmt=v=>{if(v==null)return'—';const a=Math.abs(v),s=v<0?'-':'';if(a>=1e8)return s+(a/1e8).toFixed(2)+'億';if(a>=1e4)return s+Math.round(a/1e4)+'萬';return s+Math.round(a)};
const pct=v=>v==null?'—':(v>0?'+':'')+Number(v).toFixed(2)+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
const actionLabel={CONSIDER_ENTRY:'可考慮進場',WAIT:'等待確認',EXCLUDE:'排除',OBSERVE_ONLY:'只觀察'};
function hist(h){if(!h||h.display_rate==null)return `<span>歷史相似情境</span><b>樣本不足｜n=${h?.n??0}</b>`;return `<span>歷史相似情境｜n=${h.n}</span><b>${(h.display_rate*100).toFixed(1)}%</b>`}
function flowCard(r,i){return `<div class="card ${r.stale_price_data?'stale':''}"><div class="r1"><div class="rank">${i+1}</div><div class="identity"><div class="name">${esc(r.name)}</div><div class="code">${esc(r.symbol)}</div></div><div class="flow"><div class="amt ${r.flow_direction==='inflow'?'in':'out'}">${fmtAmt(r.net_flow_amount)}</div><div class="chg ${(r.price_change_pct||0)>=0?'up':'down'}">${pct(r.price_change_pct)}</div></div></div><div class="chips"><span class="pill info">金額門檻 ${r.flow_threshold_pass===true?'通過':r.flow_threshold_pass===false?'未通過':'NO_DATA'} · ${r.flow_consecutive_ticks} ticks</span><span class="pill ${r.chip_state==='GOOD'?'good':r.chip_state==='WEAK'?'bad':''}">籌碼 ${esc(r.chip_state)}</span><span class="pill">CLV ${r.close_location_value==null?'—':(r.close_location_value*100).toFixed(0)+'%'} · ${esc(r.clv_confidence)}</span><span class="pill">${esc(r.volume_quality)}</span></div><div class="decision"><div class="state">${esc(r.state)}</div><div class="action">${esc(actionLabel[r.action]||r.action)}</div><div class="text">${esc(r.summary)}</div><div class="history">${hist(r.history)}</div><div class="details">foreign 4D ratio：${r.foreign_net_4d_ratio==null?'—':(r.foreign_net_4d_ratio*100).toFixed(2)+'%'} ｜ price date：${esc(r.price_data_date||'—')} ｜ chip date：${esc(r.chip_data_date||'—')}<br>flow：${esc(r.flow_data_time||'—')} ｜ snapshot：${esc(r.snapshot_time||'—')}</div></div></div>`}
function rpill(label,ok){return `<span class="pill ${ok?'rpass':'rfail'}">${label} ${ok?'✓':'×'}</span>`}
function reversalCard(r,i){const note=r.control_note?`<div class="note">${esc(r.control_note)}</div>`:'';return `<div class="card ${r.state==='STALE_PRICE_DATA'?'stale':''}"><div class="r1"><div class="rank">${i+1}</div><div class="identity"><div class="name">${esc(r.name)}</div><div class="code">${esc(r.symbol)}</div></div><div class="flow"><div class="amt rev">A-flow ${r.current_aflow==null?'—':Number(r.current_aflow).toLocaleString()}</div><div class="chg ${(r.price_change_pct||0)>=0?'up':'down'}">${pct(r.price_change_pct)}</div></div></div><div class="chips">${rpill('R1 前期流出',r.r1_prior_outflow)}${rpill('R2 價格反轉',r.r2_price_reversal)}${rpill('R3 A-flow Flip',r.r3_aflow_flip)}${rpill('R4 Persistence',r.r4_aflow_persistence)}${rpill('R5 Price Confirm',r.r5_price_confirmation)}<span class="pill rev">${r.r1_extreme_outflow?'EXTREME OUTFLOW':r.r1_prior_outflow?'OUTFLOW':'CONTROL / NO 5D-20D'}</span></div><div class="decision"><div class="state">${esc(r.state)}</div><div class="action">只觀察｜Research Layer</div><div class="text">${esc(r.summary)}</div>${note}<div class="history">${hist(r.history)}</div><div class="details">A-flow ratio：${r.aflow_ratio==null?'—':(r.aflow_ratio*100).toFixed(2)+'%'} ｜ 5D inst ratio：${r.institutional_net_5d_ratio==null?'—':(r.institutional_net_5d_ratio*100).toFixed(2)+'%'} ｜ 20D：${r.institutional_net_20d_ratio==null?'—':(r.institutional_net_20d_ratio*100).toFixed(2)+'%'}<br>Persistence：${esc(r.reference_ts||'—')} → ${esc(r.flow_data_time||'—')} (${r.elapsed_minutes??'—'}m) ｜ ΔA-flow ${r.aflow_delta==null?'—':Number(r.aflow_delta).toLocaleString()} ｜ ΔPrice ${r.price_delta==null?'—':Number(r.price_delta).toFixed(2)}</div></div></div>`}
function render(d){const s=document.getElementById('summary');const box=document.getElementById('list');if(MODE==='reversal'){s.innerHTML=`交易日 ${esc(d.trade_date)} · Regime ${esc(d.market_regime)} · <span class="warn">反轉軌仍為 Research / Observation Layer，不產生正式 ACTION</span>`;if(!d.results?.length){box.innerHTML='<div class="empty">尚無 Day-1 reversal snapshot。</div>';return}box.innerHTML=d.results.map(reversalCard).join('');return}const v=d.rescue_validation||{};s.innerHTML=`交易日 ${esc(d.trade_date)} · Regime ${esc(d.market_regime)} · Rescue 正式規則：<span class="${v.approved?'':'warn'}">${v.approved?'已通過樣本外門檻':'尚未通過，僅觀察'}</span>`;if(!d.results?.length){box.innerHTML='<div class="empty">目前資料庫沒有這個方向的盤中 snapshot。<br>不使用舊資料補值，因此顯示 NO_DATA。</div>';return}box.innerHTML=d.results.map(flowCard).join('')}
async function load(){const box=document.getElementById('list');box.innerHTML='<div class="empty">讀取中…</div>';try{const url=MODE==='reversal'?'/api/flow-chips/reversal-day1':'/api/flow-chips/top10?direction='+MODE;const r=await fetch(url);render(await r.json())}catch(e){box.innerHTML='<div class="empty">讀取失敗：'+esc(e.message)+'</div>'}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');MODE=b.dataset.mode;load()});setInterval(load,30000);load();
</script>
</body></html>
